address": "제주시 구좌읍 김녕로21길 21", "hours": "晚市為主；出發前查 Naver", "rest": "份量大，人少留意", "note": "김녕(東北岸)，조천 base 東邊約15–20分鐘、近東福 London Bagel。超大份魚生＋烤海螺，平靚正，送濟州柑。", "phone": "—", "sources": "https://www.tripadvisor.com/Restaurant_Review-g297885-d28119903-Reviews-Ory_Fishmarket-Jeju_Jeju_Island.html"}, {"id": "景點24", "kind": "景點", "when": "11/2 一 晚 行街", "name": "이중섭거리｜Lee Jung-seob Art Street", "address": "서귀포시 이중섭로 29", "hours": "街道全日;夜晚有氣氛", "rest": "—", "note": "서귀포매일올레시장隔籬，中文 base 約15分鐘。夜晚行街、咖啡、手作;附近올레시장有夾公仔인형뽑기同街頭小食。", "phone": "—", "sources": "https://visitjeju.net/kr/detail/view?contentsid=CONT_000000000500731"}, {"id": "景點25", "kind": "景點", "when": "11/3 二 晚 夜景", "name": "새연교 · 새섬｜Saeyeon Bridge & Saeseom", "address": "서귀포시 남성중로 40 (서귀포항 · 새연교)", "hours": "戶外,夜晚打燈;全日", "rest": "—", "note": "서귀포港步行橋,晚上橋同새섬打燈,行一圈約30–40分鐘;中文 base 約20分鐘。免費夜景散步。", "phone": "—", "sources": "https://visitjeju.net/kr/detail/view?contentsid=CONT_000000000500833"}, {"id": "景點26", "kind": "景點", "when": "10/30 五 10:00 行街", "name": "제주 원도심 · 칠성로 쇼핑거리（＋오브젝트 Object）", "address": "제주시 관덕로8길 3", "hours": "店舖約10:00–21:00(Object 11:00開,各店不同)", "rest": "—", "note": "抵埗日輕鬆行街(唔使玩):칠성로購物街＋문구/소품 Object 제주점,近烏津早餐同東門。醒下神。", "phone": "—", "sources": "https://visitjeju.net/kr/detail/view?contentsid=CNTS_000000000019891"}, {"id": "景點27", "kind": "景點", "when": "10/30 五 16:45 散步", "name": "함덕海水浴場 · 서우봉｜Hamdeok Beach", "address": "제주시 조천읍 조함해안로 519-10", "hours": "戶外,全日", "rest": "—", "note": "조천 base 隔籬,翡翠色海灘＋서우봉步道。抵埗日輕鬆散步/睇日落,唔使玩。", "phone": "—", "sources": "https://visitjeju.net/kr/detail/view?contentsid=CONT_000000000500342"}, {"id": "景點28", "kind": "景點", "when": "11/2 一 晚（選）", "name": "천지연폭포 야간개장｜Cheonjiyeon Falls（夜）", "address": "서귀포시 남성중로 2-15", "hours": "夜間點燈約~21:00(末票現場確認)", "rest": "風雨或休", "note": "서귀포市中心,同 올레시장/이중섭/새연교 同區(5–10分鐘)。夜晚點燈瀑布,平路易行;攰就跳過。", "phone": "064-733-1528", "sources": "https://visitjeju.net/kr/detail/view?contentsid=CONT_000000000500352"}, {"id": "餐廳21", "kind": "餐廳", "when": "11/1 日 17:15 城山晚餐（實）", "name": "오조해녀의집（해물뚝배기/전복죽）", "address": "서귀포시 성산읍 한도로 141-13", "hours": "07:00–19:00 每日", "rest": "해녀直營;旺季排隊", "note": "日出峰附近最有名海女食堂,해물뚝배기(海鮮)＋전복죽。揀海鮮뚝배기唔一定要鮑魚。有大停車場。", "phone": "064-784-7789", "sources": "https://www.diningcode.com/profile.php?rid=3efAfsCPJuD8"}, {"id": "餐廳22", "kind": "餐廳", "when": "11/4 三 12:00 市區午餐（實）", "name": "금복식당（제주 고기국수）", "address": "제주시 동문로 16", "hours": "08:30–18:30、LO18:10", "rest": "每月第1、3個週日休（週三照開）", "note": "東門/舊城區,離 Gomimi(북성로)同東門市場行得到。濟州名物고기국수＋돔베고기,啱11/4午餐再去Gomimi/東門。", "phone": "—", "sources": "https://www.diningcode.com/profile.php?rid=ohG2IpuWQopQ"}, {"id": "景點29", "kind": "景點", "when": "11/1 日 10:00（預約）", "name": "제주 레일바이크｜Jeju Rail Bike", "address": "제주시 구좌읍 용눈이오름로 641", "hours": "09:00–17:30 연중무휴", "rest": "Naver 預約 21% off;預約後1鐘起用", "note": "용눈이오름一帶草原景,踩軌道單車一圈約40–50分。喺 조천→城山 路上(順路)。要 Naver 預約揀09:00場,玩完去城山港搭船。", "phone": "—", "sources": "https://www.instagram.com/jeju_railbike_/"}], "notes": [["計劃基準", "2026/10/30–11/4；6日5夜", "10/29 出發前活動；去程02:10，回程22:10。落地時間未知，未使用舊表06:30當已確認資料。", "用戶確認"], ["★ 今次改版改咗乜", "順路為主、填返空檔、減鮑魚", "1) 11/2最大改動：刪走Gilgal→翰林西岸→折返市區嘅繞路，午餐改用濟州市光平中路店，同HARIBO同區，全日變一條線，慳約1.5個鐘。2) 10/31：新星岳由候選升做正式站（同981只差10分鐘車程），變成981→新星岳→涯月海岸→夜市一條線，唔再由西岸折返市區。3) 10/30：填返落機到午餐之間嘅空檔（道頭峰＋梨湖，機場旁），晚餐改東門市場掃街。4) 11/3：填返15:30–18:30嘅三個鐘空檔（오설록＋山房山日落，同區10分鐘）。5) 11/4：Gomimi調早到13:30（售完即收），88豬肉升做正式晚餐（蓮洞區內），還車推遲到19:00。6) 鮑魚由3–4處減到1處（只留10/31恩惠鮑魚石鍋飯）。7) 加入你指定嘅흑돈가（10/30首晚，近酒店）；為免흑돈가＋Doldam＋88三餐黑豬肉，88降做備選、11/4尾晚改海鮮黃金漁場。晚餐分佈：黑豬肉2（흑돈가／Doldam）、海鮮2（城山鍋／黃金漁場）、夜市1、西歸浦待選1。", "用戶指示 2026-09-23"], ["★ 可選升級：改住宿日期", "濟州市2晚 → 西歸浦3晚", "如果住宿未落實，可以考慮：10/30、10/31住濟州市；11/1退房後直接東行（東福貝果 → 城山 → 牛島 → 日出峰 → 城山晚餐 → 西歸浦入住），11/1、11/2、11/3住西歸浦。咁樣11/1唔使由城山開80分鐘返濟州市，慳多約80分鐘，而且日出峰仍然避開11/2休館。代價係Gilgal同HARIBO要改由南部上返嚟（11/4北上時順路做），天王寺賞楓就要換做山君不離芒草／思連伊林蔭路。住宿已訂就照用而家版本。", "助理建議；未執行"], ["時間與車程", "每程加粗略預留；非導航實測", "＊車程都是粗略預留，非逐段導航實測；住宿A=조천/함덕、住宿B=中文/하원동估算。一般另留泊車步行10–15分鐘。조천 base 令11/1城山(~50分)、11/2朝東福貝果/Gilgal(~15分)好近；代價係10/31西部日(981/騎馬/涯月)單程~55–65分。11/2 Gilgal後返市區食刀削麵(同HARIBO同區)再落中文，一條線。道頭峰/梨湖由10/30移去11/4返機場前。未定原店車程不假填。", "助理區域粗估；非逐段地圖查核"], ["住宿", "住宿A：조천/함덕 3晚 → 住宿B：中文/하원동 2晚", "10/30入住조천(咸德海灘一帶)，連住10/30、10/31、11/1，11/2退房；11/2入住西歸浦中文/하원동，連住11/2、11/3，11/4退房。全程只搬一次。조천 base 貼近城山牛島(11/1)同東福貝果/Gilgal(11/2朝)；中文 base 貼近Waterworld、Doldam同11/4上1100道路。都有車位。", "Airbnb 2026-09-24"], ["原 Must Do 1：賞楓", "11/4 約10:45 天王寺＋1100高地濕地", "南部退房後行1100道路北上，順路先停1100高地濕地（木棧道15分鐘），再去天王寺。山路天氣不佳就直接返市區，不為景點繞山。紅葉、道路情況待當季確認。", "原表；2026紅葉待查"], ["原 Must Do 2：HARIBO", "11/2 14:15–16:15 HARIBO", "搬屋日：貝果、Gilgal、市區刀削麵後參觀，再經5·16落西歸浦。已核實地址제주시 아연로 444-1、10:00–19:00、最後入場18:00、距機場約15分鐘車程，同刀削麵店同一區，唔使兜路。排隊拖延可延後南部入住。", "https://www.visitjeju.net/en/detail/view?contentsid=CNTS_300000000013151&menuId=DOM_700000000010774"], ["原 Must Do 3：城山日出峰", "11/1 牛島回程後，約15:40", "11月售票至17:00；每月首個週一休＝11/2，所以日出峰只可以擺11/1，勿改。조천 base 去城山港約50分，08:30出發即可(比市區早半個鐘出門)。目標14:30乘船離開牛島，15:00取車，17:15城山海鮮鍋後返조천。11/1星期日船同泊車會逼。", "https://www.visitjeju.net/en/detail/view?contentsid=CONT_000000000500349"], ["原 Must Do 4：樹木園夜市", "10/31 19:00 樹木園夜市", "改成西部一日嘅終點：981 → 新星岳 → 涯月海岸 → 返市區夜市，一條線唔折返。公開9–5月18:00–22:00、6–8月至23:00，連年無休。⚠️官方頁一度標示休場、2026.03.01重開，出發前用IG @ya_sijang 或電話064-742-3700再確認。天氣差用黃金漁場後備。", "https://www.visitjeju.net/kr/detail/view?contentsid=CNTS_200000000007330"], ["原 Must Do 5：Gilgal Farm", "11/2 10:30–12:15 Gilgal・必去", "조천 base 退房後先去東福倫敦貝果(~15分)、再Gilgal(조천읍,~15–20分)——兩個都喺住宿隔籬，一啲都唔兜。農場之後返濟州市食刀削麵、玩HARIBO，先至南下中文住宿B。採橘子未核實。", "https://mom-mom.net/en/travel/places/6715ad60c723b7a12f3c90e0"], ["原 Must Do 6：山茶花之丘", "11/3 14:00 山茶花之丘", "已移到11月，按公開冬季08:30–18:00、末班17:00規劃；14:00到有餘裕，花況未確認。", "原表"], ["原 Must Do 7：Waterworld", "11/3 10:00–11:30 Waterworld", "已核實為世界盃球場水主題媒體藝術體驗；10–20、最後入場19、全年。", "https://english.visitkorea.or.kr/svc/whereToGo/locIntrdn/rgnContentsView.do?vcontsId=221767"], ["原 Must Do 8：981 Park", "10/31 10:00 981 Park", "避開通宵機首日；票種、駕駛條件及營運安排再確認。", "https://www.981park.com/OPERATION"], ["原 Must Eat 1：88豬肉", "11/4 17:30 蓮洞・正式一餐", "★由後備升做正式晚餐：제원길 7 就喺蓮洞購物區，掃完貨行過去就食得，唔使再開車，之後直接去還車。已核實16:30開門；閉店來源05:00／06:00不同；未獲指定日確認。", "https://english.visitkorea.or.kr/svc/whereToGo/locIntrdn/rgnContentsView.do?vcontsId=52744"], ["原 Must Eat 2：海鮮鍋", "11/1 17:00 城山海鮮鍋・必食", "保留海鮮鍋菜式及時段。日出王湯鍋只是候選店，未核實是否符合想要的螃蟹／鮑魚／扇貝大鍋；店家及指定日期仍待確認。", "https://www.visitjeju.net/kr/detail/view?contentsid=CONT_000000000501342\nhttps://www.menupan.com/restaurant/onepage.asp?acode=H601805"], ["原 Must Eat 3：白帶魚", "11/3 12:30 春心家候選", "10:30–20，午休15:30–17；全年。已避開午休，未確認指定日公告。", "https://info.koreacharts.com/tour/2654442/contents.html"], ["原 Must Eat 4：解酒湯", "10/30 早餐：烏津／Eunhee備選", "烏津本館06–22；Eunhee高마로13길8店平日06–15、週四休，10/30週五不撞休。排隊長可換店，車程需另計。", "https://www.visitjeju.net/kr/detail/view?contentsid=CNTS_000000000018375\nhttps://info.koreacharts.com/tour/1861280/contents.html"], ["原 Must Eat 5：London Bagel", "11/2 09:30 倫敦貝果博物館・必去", "按公開每日08–18，週一09:30到店。接Gilgal、午餐、HARIBO及南部入住；排隊久則順延後段並通知住宿，款式及存貨不保證。", "https://www.koursea.com/place/1076/\nhttps://app.catchtable.co.kr/ct/shop/london_bagel_museum_jeju"], ["原 Must Eat 6：濟州橘子", "11/4 14:30 東門市場・濟州橘子", "主行程保留食橘子／買橘子；橘子手信留最後一日買，唔使拎足六日。東門市場今次去兩次：10/30晚餐掃街、11/4下午買手信，兩次目的唔同。", "原表"], ["原 Must Eat 7：活鮑魚海鮮鍋", "★已降為備選（你話鮑魚太多）", "按你指示「東門市場 >> 鮑魚、好似好多鮑魚」：10/30晚餐改為東門市場掃街，活鮑魚海鮮火鍋降為備選。全程鮑魚由3–4處減到1處（10/31午餐恩惠鮑魚石鍋飯）。城山海鮮鍋保留，但係蟹／扇貝為主。想食返活鮑魚火鍋可以換11/4晚餐，但店家／地址一直未核實。", "用戶指示 2026-09-23"], ["原 Must Eat 8：手工刀削麵", "11/2 13:00 濟州市（光平中路）", "原제주조개칼국수店址與營業未能唯一核實，保留菜式。今次直接採用翰林刀削麵 濟州機場店（제주시 광평중길 82，08:00–15:00、週日休）做正式午餐——唔係因為原店唔得，而係佢同HARIBO同區，可以取消翰林西岸嗰段來回繞路。星期一不撞固定休；資料較舊，出發前再核實。", "https://info.koreacharts.com/tour/2359240"], ["原 Must Eat 9：Doldam黑豬肉", "11/3 18:30 Doldam Black Pork・必食", "南部日獨立一餐。暫排中文店일주서로909，公開11–23、LO22、全年；週二按常規可行，未確認指定日。原意分店待確認，88豬肉留後備。", "https://info.koreacharts.com/tour/2876704/contents.html"], ["★ 偶來市場", "南部備選／不排首日", "保留南部備選，11/2入住後如體力許可可自行選；不回排通宵機首日，也不取代必食餐。", "https://www.visitjeju.net/en/detail/view?contentsid=CONT_000000000500731&menuId=DOM_000001920001000000"], ["★ 正房瀑布", "南部備選／不排首日", "保留南部備選，不排首日；11/3已有Waterworld及山茶花，不硬塞。", "https://english.visitkorea.or.kr/svc/whereToG function places(q){const list=DATA.places.filter(p=>Object.values(p).join(' ').toLowerCase().includes(q.toLowerCase()));document.getElementById('results').innerHTML=list.map(p=>`<article class="placecard"><small>${esc(p.kind)} · ${esc(p.when)}</small><h3>${esc(p.name)}</h3><p>${esc(p.address)}</p><p><b>時間：</b>${esc(p.hours)}</p><p>${esc(p.rest)}</p><p class="pending">${esc(p.note)}</p><p>${esc(p.phone)}</p>${map(p)}<div class="sources">${src(p.sources)}</div></article>`).join('')||'<div class="empty">搵唔到，試下其他名稱。</div>';}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-view]');if(tab){view=tab.dataset.view;render();return}const d=e.target.closest('[data-day]');if(d){day=+d.dataset.day;view='daily';render();return}const step=e.target.closest('[data-step]');if(step){day=Math.max(0,Math.min(5,day+(+step.dataset.step)));render();document.querySelector('.tabs').scrollIntoView({behavior:'smooth'});return}const c=e.target.closest('[data-check]');if(c){done[c.dataset.check]=!done[c.dataset.check];try{localStorage.setItem('jeju2026checks',JSON.stringify(done))}catch(e){}c.classList.toggle('on',done[c.dataset.check]);c.textContent=done[c.dataset.check]?'✓':'○';c.setAttribute('aria-pressed',!!done[c.dataset.check]);}});render();
