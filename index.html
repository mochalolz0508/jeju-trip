urces": "https://visitjeju.net/kr/detail/view?contentsid=CONT_000000000500342"}, {"id": "景點28", "kind": "景點", "when": "11/2 一 20:00（升做正式）", "name": "天地淵瀑布（夜）｜천지연폭포", "address": "서귀포시 남성중로 2-15", "hours": "09:00–22:00、尾入21:20", "rest": "風雨或休", "note": "西歸浦市中心,同偶來市場／李仲燮街同區(行得到)。成人₩2,000,平路石屎步道15分鐘。42年嚟首次換新夜燈。★原行程零瀑布,呢個零繞路,2026-10-13由「攰就跳過」升做正式。", "phone": "064-733-1528", "sources": "https://visitjeju.net/kr/detail/view?contentsid=CONT_000000000500352"}, {"id": "餐廳21", "kind": "餐廳", "when": "11/1 日 18:00–19:00 城山晚餐", "name": "吾照海女之家（海鮮砂鍋）｜오조해녀의집", "address": "서귀포시 성산읍 한도로 141-13", "hours": "07:00–19:00 每日", "rest": "海女直營;旺季排隊", "note": "日出峰附近最有名海女食堂,海鮮砂鍋(海鮮)＋鮑魚粥。揀海鮮砂鍋唔一定要鮑魚。有大停車場。", "phone": "064-784-7789", "sources": "https://www.diningcode.com/profile.php?rid=3efAfsCPJuD8"}, {"id": "餐廳22", "kind": "餐廳", "when": "11/4 三 午餐備選（主行程係大事家玉鯛燒）", "name": "金福食堂 豬肉湯麵｜금복식당", "address": "제주시 동문로 16", "hours": "08:30–18:30、LO18:10", "rest": "每月第1、3個週日休（週三照開）", "note": "濟州名物豬肉湯麵 ＋ 切片白煮豬肉。喺東門路，離 Gomimi（北城路）同東門市場行得到。★係全程唯一缺嘅「豬肉湯麵」—— 原本10/30午餐嘅姐妹湯麵俾你好鮑魚頂走咗。想補返就11/4午餐由大事家換做呢間（順路仲好，唔使由蘆衡洞兜去東門），代價係冇咗玉鯛燒，而且豬肉餐數由2變3，撞「唔好三餐豬」。", "phone": "—", "sources": "https://www.diningcode.com/profile.php?rid=ohG2IpuWQopQ"}, {"id": "景點29", "kind": "景點", "when": "11/1 日 14:20–15:05（午場）", "name": "濟州軌道單車｜제주 레일바이크", "address": "제주시 구좌읍 용눈이오름로 641", "hours": "09:00–17:30 全年無休", "rest": "Naver 預約 21% off;預約後1鐘起用", "note": "龍眼岳一帶草原景，踩軌道單車一圈約35–50分鐘。09:00–17:30全年無休。現場買飛都得;網上預約約8折。★由09:00首班改落午場 —— 剪走牛島之後冇咗船期，唔使趕。", "phone": "—", "sources": "https://www.instagram.com/jeju_railbike_/"}, {"id": "景點30", "kind": "景點", "when": "11/4 三 17:00 傍晚順路（備選・貨冇涯月店多）", "name": "Miffy 橘橘Store 道頭店（備選）｜귤귤스토어 도두점", "address": "제주시 서해안로 238", "hours": "09:00–19:00 每日", "rest": "限定款售完即止", "note": "濟州市 西海岸路238,機場／道頭旁,09:00–19:00。⚠️唔好當佢等於涯月店 —— 涯月店先係 Miffy 主場（用戶2026-10-15確認）。呢間當「11/4還車前最後補飛」:同彩虹海岸路、道頭峰、黃金漁場同一撮,行路／2–3分鐘車程。未加入正式行程,想要先講。", "phone": "064-712-0199", "sources": "https://triple.guide/attractions/2a314211-11d8-4748-a2ee-3837e62eb001"}, {"id": "景點31", "kind": "景點", "when": "11/1 日 09:30–10:30（住宿門口）", "name": "萬丈窟｜만장굴", "address": "제주시 구좌읍 만장굴길 182", "hours": "09:00–18:00（末入 17:10）", "rest": "每月第1個週三休；成人約₩4,000", "note": "世界自然遺產熔岩洞窟，平路步道來回約1公里（約1個鐘），長年約15°C，落雨大風照玩。入口有樓梯、地面濕滑，慢行。成人約₩4,000。每月第1個週三休（11/1係星期日✅）。★2026-10-16由10/30搬嚟，剪走牛島之後嗰日空咗，而且佢本身就喺東線路上。", "phone": "064-710-7903", "sources": "https://www.visitjeju.net/kr/detail/view?contentsid=CONT_000000000500346"}, {"id": "景點32", "kind": "景點", "when": "10/31 六 16:40 日落", "name": "俠才海灘｜협재해수욕장", "address": "제주시 한림읍 협재리 2497-1", "hours": "戶外,全日", "rest": "—", "note": "西部翠綠海灘,望飛揚島,日落超靚。就喺 Flowave(翰林)隔籬 5–10分鐘,10/31 西線順路。", "phone": "—", "sources": "https://www.visitjeju.net/kr/detail/view?contentsid=CONT_000000000500348"}, {"id": "餐廳23", "kind": "餐廳", "when": "11/4 三 12:00 午餐（玉鯛燒）", "name": "大事家 玉鯛燒定食｜큰일집", "address": "제주시 동광로 79 1층", "hours": "09:30–21:30 每日", "rest": "—", "note": "濟州高級玉鯛(玉鯛)一夜乾鹽燒,定食₩10,000 抵食。喺 蘆衡洞/蓮洞(近蓮洞/機場),尾晚食玉鯛,唔重複海鮮。", "phone": "064-748-8788", "sources": "https://www.diningcode.com/list.dc?query=제주시%20옥돔구이"}, {"id": "餐廳24", "kind": "餐廳", "when": "11/1 日 10:50–11:50 午餐【海膽】", "name": "Gommak 食堂（海膽麵）｜곰막식당", "address": "제주시 구좌읍 구좌해안로 64（⚠️唔喺朝天,舊資料記錯）", "hours": "09:30–20:00（午休15:00–16:00、尾叫19:00）", "rest": "逢星期四休（11/1係星期日✅）", "note": "店內大魚缸即撈即煮。招牌＝海膽麵（海膽麵）＋生魚片麵（生魚片麵）。★剪走牛島之後，全程嘅海膽改喺呢度食。🔴⚠️11月唔係海膽季 —— 濟州做海膽嘅紫海膽春夏先肥，10–12月好多舖轉賣蠔 ⇒ 出發前／當朝打☎064-727-5111問實有冇海膽;冇就食招牌生魚片麵。", "phone": "064-727-5111", "sources": "https://www.diningcode.com/list.dc?query=조천%20곰막식당"}, {"id": "景點33", "kind": "景點", "when": "10/30 五 10:00 商場", "name": "夢塔 大商場｜제주 드림타워", "address": "제주시 노연로 12", "hours": "商場/食閣 各店約10:00–22:00", "rest": "—", "note": "濟州市最大複合resort:Connect retail 商場＋食閣＋高層景觀,室內好行,啱抵埗日/落雨。近機場蘆衡洞。", "phone": "—", "sources": "https://www.visitjeju.net/kr/detail/view?contentsid=CONT_000000000501234"}, {"id": "景點34", "kind": "景點", "when": "✂️已剪（純影相牧場;動物體驗11/2 Gilgal已有）", "name": "聖依西多牧場（已剪）｜성이시돌목장", "address": "제주시 한림읍 산록남로 53", "hours": "戶外全日;牛奶咖啡店約10:00–18:00", "rest": "—", "note": "拱形建築拱形建築＋牧場＋牛奶咖啡店(牛奶雪糕),影相超靚。鹿高岳→俠才 路上(西部),輕鬆stop。", "phone": "—", "sources": "https://www.visitjeju.net/kr/detail/view?contentsid=CONT_000000000500390"}, {"id": "景點35", "kind": "景點", "when": "11/1 日 16:55–17:45（日落17:36）", "name": "涉地可支（涉地岬）｜섭지코지", "address": "서귀포시 성산읍 고성리 일대（섭지코지）", "hours": "戶外,全日開放;建議日間至日落", "rest": "大風日崖邊注意;泊車另收費", "note": "中文旅遊資料多數叫「涉地可支」，係韓文 涉地可支 嘅音譯，同一個地方。日出峰約15分＊。平路海岬步道,望城山日出峰全景＋燈塔。11/1日落17:36,啱啱golden hour。★由牛島剪走嘅時間執返嚟(2026-10-13);之前因為11/1太逼而放棄過。唔想行就喺入口／車上望一望都影到。", "phone": "—", "sources": "2026-10-13 新增;出發前用 Naver 地圖確認泊車位置"}, {"id": "景點36", "kind": "景點", "when": "✂️已剪（牛島已取消）", "name": "檢黑沙灘快艇（已剪）｜검멀레 보트투어", "address": "제주시 우도면 검멀레해변", "hours": "日間;⚠️11月運營未確認", "rest": "天氣／風浪停航;牛島水上項目多數4–10月做", "note": "✂️2026-10-16隨牛島一齊剪走。原本係₩20,000–30,000／人、15–30分鐘嘅快艇，由海上睇藍洞。剪走原因見「已剪／已否決」。", "phone": "—", "sources": "https://kr.trip.com/moments/detail/jeju-island-297-10720650/"}, {"id": "景點37", "kind": "景點", "when": "✂️已剪（2026-10-21，改用正房瀑布）", "name": "天帝淵瀑布｜천제연폭포", "address": "서귀포시 천제연로 132", "hours": "約09:00–18:00（現場確認）", "rest": "風雨或休", "note": "三段瀑布＋七仙女橋，成人₩2,500，離中文住宿5分鐘。✂️2026-10-21剪走：加咗潛水艇之後11/3朝只夠塞一個瀑布，而潛水艇喺西歸浦港、正房瀑布就喺隔籬5分鐘（天帝淵要揸返25分鐘去中文），加上正房係全國唯一直接落海嘅瀑布、更獨特 ⇒ 改用正房。", "phone": "—", "sources": "https://www.ktriptips.com/kor/tourspot/126439"}, {"id": "景點38", "kind": "景點", "when": "11/3 二 16:00–16:45（新增）", "name": "龍頭海岸｜용머리해안", "address": "서귀포시 안덕면 사계리（산방산 山腳）", "hours": "日間;潮汐／風浪決定開放", "rest": "⚠️漲潮或風浪大即封,現場問售票處", "note": "山房山腳下嘅海蝕崖棧道,約₩2,000,平路行30–40分鐘,唔使行山。山茶花落嚟10–15分,同沙溪日落點就喺隔籬 —— 封咗就直接去沙灘睇日落,零損失。", "phone": "—", "sources": "2026-10-13 新增;當日現場確認開放"}, {"id": "景點39", "kind": "景點", "when": "10/30 五 09:00–09:30（新增）", "name": "龍頭岩＋龍淵吊橋｜용두암 · 용연구름다리", "address": "제주시 용담이동 2581（용두암）", "hours": "戶外,24小時開放", "rest": "無固定休;大風／大浪日崖邊注意,免費", "note": "龍頭形狀嘅海邊火山岩,濟州市最經典地標之一。免費,影相15–20分鐘。隔籬步行5分鐘係 龍淵吊橋 龍淵吊橋。喺 西沙路(烏津解酒湯) → 蘆衡洞(夢塔) 途中約10分＊,填返夢塔10:00開舖之前嘅死位。取車手續拖得耐就第一個跳。 同一條 龍潭–道頭 海岸路再西行就係彩虹海岸路,但彩虹嗰段喺道頭(11/4傍晚先去),今朝唔使兜。", "phone": "—", "sources": "2026-10-13 新增（用戶要求）"}, {"id": "景點40", "kind": "景點", "when": "11/1 日 13:05–14:00", "name": "榧子林 千年榧樹林｜비자림", "address": "제주시 구좌읍 비자숲길 55", "hours": "09:00–18:00（尾入17:00）", "rest": "全年無休;泊車免費", "note": "2,800棵500–800年樹齡嘅榧樹，樹高7–14米。全程平路步道，完全唔使爬山，行約1個鐘。成人₩3,000／青少年₩1,500。⚠️係常綠林唔係紅葉，睇紅葉留返11/4漢拏山。★2026-10-16剪走牛島之後加入，喺萬丈窟同龍眼岳中間，順路。", "phone": "—", "sources": "https://www.ktriptips.com/kor/tourspot/126472"}, {"id": "景點41", "kind": "景點", "when": "11/4 三 15:45–16:45（新增）", "name": "大創 DAISO 濟州蓮洞本店｜다이소 제주연동본점", "address": "제주시 일주서로 7864", "hours": "10:00–22:00", "rest": "全年;☎1522-4400", "note": "濟州最大嗰間大創（本店）。₩1,000–5,000 平價雜貨：零食、美妝、文具、廚房用品、旅行小物。★擺喺11/4蓮洞嗰個鐘 —— 三個服裝牌子已經喺舊城區搞掂，嗰個鐘本來冇目標。另一間「東門市場店」（觀德路68、10:00–22:00、冇泊車）就喺13:15–15:30舊城區步行圈入面，但嗰個 cluster 已經5站135分鐘，加落去會爆 ⇒ 二揀一。", "phone": "1522-4400", "sources": "https://www.ktriptips.com/kor/shopping/4026823"}, {"id": "景點42", "kind": "景點", "when": "11/4 三 約15:20（原道心 cluster 第⑥站）", "name": "LLOYD 珠寶／手錶 濟州店｜로이드 제주점", "address": "제주시 중앙로 74 1층", "hours": "10:30–20:00 每日", "rest": "可退稅（Tax Refund Shop）", "note": "韓國 E-Land 旗下嘅珠寶／時尚手錶牌子（1990年創立），由經典手錶到潮流飾物都有，價錢親民。★喺11/4原道心步行圈入面，同 Matin Kim（中央路27-5）同一條中央路，行約7分鐘 —— 但係成個 cluster 最遠嗰個（其餘互相5分鐘內），所以擺最後一站。加咗佢之後 cluster 由135分鐘變155分鐘，蓮洞順延到16:00，日落同晚餐唔受影響。", "phone": "0507-1404-4489", "sources": "https://www.ktriptips.com/eng/shopping/4014406"}, {"id": "景點43", "kind": "景點", "when": "11/4 三 16:05–16:40（新增）", "name": "新羅免稅店 濟州店｜신라면세점 제주점", "address": "제주시 노연로 69", "hours": "10:00–19:00 全年無休", "rest": "⚠️唔會即場畀貨，要喺濟州機場提貨處領", "note": "離濟州機場車程約10分鐘，就喺夢塔（노연로12）隔籬。化妝品、名牌、LLOYD 都有，免稅通常平過市價。🔴市內免稅店落單有截數時間（一般出發前約4個鐘 ⇒ 22:10機即約18:10），而且一定要喺機場「인도장 提貨處」領貨，店內唔畀。16:05買有約2個鐘margin。💡零風險版：10/30 11:45行完夢塔順便行過去（同一條路3分鐘），day 1買定，代價係午餐推遲30分鐘。☎1688-1110", "phone": "1688-1110", "sources": "https://m.shilladfs.com/estore/kr/ko/shilladfscustomercenter/store"}, {"id": "景點44", "kind": "景點", "when": "10/31 六 14:45–16:00（新增）", "name": "새별프렌즈 黑鼻羊農場｜새별프렌즈（새별헤이요목장）", "address": "제주시 애월읍 평화로 1529", "hours": "09:00–18:00（尾入17:00）", "rest": "入場價未查到 —— 出發前打☎0507-1474-2832或網上平台睇", "note": "★有 Valais Blacknose 黑鼻羊（瑞士品種，黑面黑腳白捲毛），可以埋身影相，好親人。另外有羊駝、馬、驢、綿羊、黑山羊、兔仔。喺新星岳對面，離 9.81 Park 約10分鐘，完全喺10/31西線路上。⚠️Gilgal農場（11/2）冇呢隻羊。加佢嘅代價＝俠才海灘由2鐘20分壓到30分鐘。", "phone": "0507-1474-2832", "sources": "https://xn--ok0b236bp0a.com/place/28187"}, {"id": "景點45", "kind": "景點", "when": "11/3 二 09:20–10:20（新增・首班）", "name": "西歸浦潛水艇｜서귀포잠수함", "address": "서귀포시 남성중로 40（서귀포항）", "hours": "淡季平日09:20–16:00／旺季週末至18:00，每40分鐘一班", "rest": "🔴定員制必須預約；開船前20分鐘到；要帶護照填上船申報表", "note": "潛航約40分鐘，去文島一帶睇珊瑚同魚群。💰官方成人₩65,000＋道立海洋公園費₩1,000；網上平台約HKD223，一定網上訂。☎064-732-6060。11/3係星期二＝淡季平日，搭09:20首班。★係成程唯一嘅海上／水下體驗（快艇隨牛島剪咗，水上單車濟州冇）。代價：剪走大浦柱狀節理、山茶花由1鐘45剪到1鐘05、早25分鐘出發。", "phone": "064-732-6060", "sources": "https://www.submarine.co.kr/submarine/renewalReservation.do"}], "notes": [["計劃基準", "2026/10/30–11/4；6日5夜（航班＋租車全部確認）", "✅航班全部確認:去程 10/30 02:10 香港起飛 → 06:10 抵達濟州;回程 11/4 22:10 濟州起飛 → 11/5 00:20 抵達香港。✅租車已改做 07:15 取車（原本book 08:00，2026-10-15改咗）—— 慳返機場乾等嘅70分鐘，夢塔返返足1鐘45分，07:15車到手(唔係嗰陣先辦手續);手續拖到07:50都唔怕,夢塔10:00先開舖,09:40–10:00係安全墊。⚠️11/5 00:20落機:機場快綫尾班約00:48，出發前安排定返屋企交通。4人自駕，全程只搬一次屋（11/2）。", "用戶提供航班／租車資料 2026-10-15"], ["★ 2026-10-13 改版做咗乜", "順路審查 ＋ 補返瀑布 ＋ 加水上活動", "1) 10/30剪走樹木園夜市（金寧→恩秀街35–40分、再返朝天30分，淨繞路50–55分鐘夜車，而第一日通宵機冇瞓過）→ 19:40返到base早抖。2) 10/31成個朝頭早提早25分鐘，確保13:20到騎馬場做第一批（原本12:25先食飯，一排隊就趕唔切）。3) 11/1牛島加檢黑沙灘快艇做水上活動、藍洞改由海上睇；尾段執返涉地可支（日落17:36）。4) 11/2晚天地淵瀑布由「攰就跳過」升做正式（零繞路）。5) 11/3加天帝淵瀑布＋龍頭海岸，山茶花之丘由2個半鐘剪到1鐘45分。6) 11/4 Gomimi調做第一站（售完即收）；道頭峰由16:15改17:00（原本根本見唔到17:36嘅日落）；蓮洞由20分鐘假站變一個鐘。7) 黃金漁場、夢塔掃貨、新緣橋煙花 —— 用戶指定全部保留不變。", "用戶決定 2026-10-13"], ["★ 煙花(新緣橋) 照去", "10/31 六 20:00・2026最後一場", "官方『2026 金土金土新緣秀』＝4/25–10/31、逢週五六19:00–20:40、西歸浦 新緣橋。10/31係season最後一場。你全程只有10/30(五)、10/31(六)兩個show night，兩晚都住北面朝天 —— 冇得搬，只有去或唔去，用戶決定照去。代價：俠才→西歸浦55–65分＋等位60分＋西歸浦→朝天70–80分。⚠️出發前睇官方IG確認當晚冇因天氣取消。（註：新緣橋夜橋本身11/2晚喺偶來市場隔籬就行得到，你呢2個鐘買嘅淨係「煙花」）", "https://visitjeju.net/kr/festival/view?contentsid=CNTS_300000000014207"], ["✂️ 水上活動 已取消", "隨牛島一齊剪走", "原本係牛島檢黑沙灘嘅快艇（₩20,000–30,000／人、15–30分鐘，由海上睇藍洞）。2026-10-16剪走牛島之後一齊冇咗。提返：濟州冇腳踏式水上單車／鴨仔船（全韓國嘅都喺大邱、慶州、安東、巨濟、光州等內陸水域，濟州係海島冇平靜內陸湖）；鎖小角透明獨木舟冬季09:00–15:00仲開，但喺西歸浦東面，同11/3向西嘅路線相反，已否決。即係今次冇水上活動。", "用戶決定 2026-10-16"], ["✂️ 牛島全日 已剪", "2026-10-16 決定", "剪走原因唔係「唔好玩」，係連鎖風險：軌道單車時長唔確定（35分 vs 40–50分）→ 趕唔切10:30開船 → 島上壓縮 → 趕唔切15:00尾船 → 城山日出峰玩完，而日出峰11月2日休館冇第二次機會。外加每人要帶護照填上船申報表、島上得循環巴士20分鐘一班、快艇11月開唔開未確認。另外查實咗：牛島禁車令已延長到2029年7月31日，一般遊客嘅租車根本入唔到（例外：傷健／孕婦／帶嬰幼兒／喺島上過夜／16人座包車／電動氫能車）—— 所以根本冇「揸唔揸車」呢個選擇。藍洞本身要退潮先入到，而11/1係小潮日、滿潮15:09，行入去本來就唔得。失去嘅：西濱白沙（全韓唯一紅藻白沙灘，真係牛島獨有）、黑沙灘、牛島峰景、快艇。下次嚟濟州專登喺牛島過一晚（過夜先可以揸車入島）。", "用戶決定 2026-10-16"], ["★ 補返瀑布（原本六日零瀑布）", "11/2 天地淵（夜燈）＋ 11/3 正房（落海）", "濟州三大瀑布全部喺西歸浦南岸 —— ⚠️城山日出峰冇瀑布（佢係海底噴發嘅凝灰岩火山錐，主打火山口同日出）。🥇正房瀑布：全國唯一直接落海，23米，國家名勝，₩2,000，09:00–18:00（尾入17:40），130級樓梯。🥈天地淵瀑布：22米，森林峽谷，平路石屎路15分鐘，₩2,000，開到22:00有夜燈 —— 唯一夜遊到嘅。🥉天帝淵瀑布：三段＋七仙女橋，規模最大但上落較多，₩2,500。★2026-10-21定案：天地淵（11/2晚夜燈）＋正房（11/3朝，離潛水艇5分鐘）；天帝淵同大浦柱狀節理為咗塞潛水艇剪走。", "https://www.ktriptips.com/kor/tourspot/126437"], ["★ 樹木園夜市 已剪", "原10/30晚・原清單 Must Do 4", "樹木園路夜市（濟州市 恩秀街69、漢拏樹木園旁）：9–5月18:00–22:00、連年無休、免費泊車、2026年3月重開。剪佢唔係因為閂門，係位置：18:05喺金寧（東北岸）食完Ory，去夜市要35–40分（向西），再返朝天30分 —— 直接返屋企只係15–20分，淨繞路50–55分鐘夜車，而嗰晚由02:10航班計已經醒咗24個鐘。內容亦只係food truck市集（黑豬串／海鮮串／果汁＋小物攤＋busking），規模細過11/4要去嘅東門市場。曾考慮搬去11/4晚（恩秀街離機場15分、離蓮洞5–8分，完全順路），但用戶指定黃金漁場不變 ⇒ 直接剪走。", "https://www.visitjeju.net/kr/detail/view?contentsid=CNTS_200000000007330"], ["★ 夢塔掃貨 保留", "10/30 10:00–11:45（足1鐘45分）", "濟州 夢塔（Grand Hyatt Jeju、蘆衡洞洞 路蓮路12、濟州最高嗰幢）入面嘅『韓Collection HAN COLLECTION』K-fashion mall，約450品牌＋retail＋食閣＋高層景觀。排喺度嘅原因：室內（通宵機／落雨都頂得住）、離12:00午餐你好鮑魚只10分鐘、EMIS EMIS濟州獨家店喺呢度（2026/8/21開，已確認）。Matin Kim同MARITHÉ唔喺度 —— 兩間都喺原道心，11/4下午一次過行。用戶指定照去。 🆕2026-10-13：航班確認06:10落地後，09:00–10:00（夢塔未開舖）嘅死位加咗 龍頭岩 龍頭岩＋龍淵吊橋（免費、15–20分鐘、西沙路→蘆衡洞途中10分），用戶決定。取車手續拖到08:15先搞掂就跳咗佢。", "用戶決定 2026-10-13"], ["★ 黃金漁場 保留不變", "11/4 18:00 晚餐", "濟州市 射場街14、09:00–21:00、LO20:00、全年。機場旁，還車前最後一餐，生魚片／海鮮。用戶指定唔好改。時間由17:30推到18:00，因為前面道頭峰要等17:36日落。", "用戶決定 2026-10-13"], ["★ 11/1 東線一日（牛島已剪）", "全日自己揸車・冇船期・可以瞓晏啲", "08:30起身 → 09:40–10:40 萬丈窟（世界遺產熔岩洞窟，平路1公里，₩4,000）→ 11:00–12:00 Gommak 海膽麵／生魚片麵（舊左海岸路64，☎064-727-5111）→ 12:30–13:30 榧子林千年榧樹林（平路，₩3,000）→ 13:50–14:40 軌道單車（改落午場）→ 15:10–16:20 城山日出峰（售票截17:00）→ 16:40–17:45 涉地可支（日落17:36）→ 18:00–19:00 吾照海女之家 → 19:55 返到朝天。全程一條線向東，冇折返，冇硬死線 —— 唯一時間限制係日出峰17:00截票，而你15:10就到，有兩個鐘鬆動。尋晚睇完煙花22:00先返到，今日可以瞓多陣。", "用戶決定 2026-10-16"], ["★ 涉地可支", "11/1 16:40–17:45 日落", "日出峰15:10入場、16:20落返嚟，接涉地可支（約15分鐘車程），日落17:36，啱啱黃金光。平路海岬步道，望日出峰全景＋燈塔。17:45走去吾照海女之家（約15分鐘），佢19:00閂門，一個鐘夠食。", "助理建議 2026-10-13"], ["原 Must Do 1：賞楓", "11/4 10:45 天王寺＋1100高地濕地", "南部退房後行1100道路北上（1100道路橫穿漢拏山國立公園），順路先停1100高地濕地（拉姆薩濕地，木棧道15分鐘，平路免費），再去天王寺（漢拏山北坡，短途平路）。冇行登頂路線（城板岳／觀音寺要8–10鐘兼要預約）—— 呢個係「唔使行山版」漢拏山賞楓。2026預測絕頂11月6日 ⇒ 11/4差兩日，係全程最紅。山路天氣差就直接返市區，唔為景點繞山。", "原表；2026紅葉預測"], ["原 Must Do 2：HARIBO", "11/2 14:15–16:15", "濟州市 阿延路444-1、10:00–19:00、最後入場18:00、全年無休。搬屋日：貝果→Gilgal→市區刀削麵→HARIBO→經5·16落西歸浦（沿途山路紅葉）。排隊拖延就順延南部入住。", "https://www.visitjeju.net/en/detail/view?contentsid=CNTS_300000000013151"], ["原 Must Do 3：城山日出峰", "11/1 15:45（11/2休館，鎖死）", "11月06:00–18:00、售票截17:00；每月首個週一休＝11/2，所以日出峰只可以擺11/1，勿改。15:45入場趕得切，登頂來回50–60分。主角係個火山口（600米闊、99座岩峰圍住），要日光先睇得清，睇日出反而背光。", "https://www.visitjeju.net/en/detail/view?contentsid=CONT_000000000500349"], ["原 Must Do 4：樹木園夜市", "✂️已剪", "見上面「樹木園夜市 已剪」一條。2026-10-13因繞路剪走，唔係因為閂門。", "用戶決定 2026-10-13"], ["原 Must Do 5：Gilgal Farm", "11/2 10:45–12:15・必去", "朝天邑 南朝路1785-12、₩10,000、10:30–17:00（截16:30）。住宿A退房後先去東福倫敦貝果（~15分）、再Gilgal（~15–20分）—— 兩個都喺住宿隔籬，一啲都唔兜。入場送紅蘿蔔可以餵羊駝／黑豬／山羊／兔仔／小馬／鴨。", "https://mom-mom.net/en/travel/places/6715ad60c723b7a12f3c90e0"], ["原 Must Do 6：山茶花之丘", "11/3 14:00–15:45（剪咗45分鐘）", "11月08:30–18:00、末班17:00。原本俾2個半鐘 —— 一個花園唔使咁耐，剪到1鐘45分，慳返嘅時間換咗天帝淵瀑布同龍頭海岸。", "用戶決定 2026-10-13"], ["原 Must Do 7：Waterworld", "11/3 10:50–12:10", "西歸浦市 世界盃路33 濟州世界盃球場、10:00–20:00、最後入場19:00、全年。水主題媒體藝術，唔係一般泳池。因為前面加咗天帝淵＋大浦柱狀節理，開始由10:00推到10:50。", "https://english.visitkorea.or.kr/svc/whereToGo/locIntrdn/rgnContentsView.do?vcontsId=221767"], ["原 Must Do 8：981 Park", "10/31 10:00–11:15", "濟州市 涯月邑 天德路880-24。由朝天base出發要55–65分 ⇒ 08:55就要走。玩到11:15 → Miffy 11:40 → 林順之家 12:10 → 鹿高岳 13:20， l="選擇日期">${DATA.days.map((x,i)=>`<button class="date ${day===i?'active':''}" data-day="${i}" aria-pressed="${day===i}"><small>DAY 0${i+1}</small><strong>${x.date}</strong><span>週${x.weekday}</span></button>`).join('')}</div><div class="layout"><section><div class="dayhead"><div class="eyebrow">DAY 0${day+1} / ${day<3?'北面的日子':'慢慢往南'}</div><h2>${esc(d.title)}</h2><div class="route">${esc(d.route)}</div></div><div class="timeline">${d.slots.map((x,i)=>`<article class="slot"><div class="dot">0${i+1}</div><div class="card"><div class="slotlabel">${esc(x.label)}<button class="check ${done[day+'-'+i]?'on':''}" data-check="${day}-${i}" aria-label="${esc(x.label)}完成標記" aria-pressed="${!!done[day+'-'+i]}">${done[day+'-'+i]?'✓':'○'}</button></div>${x.text.split('\n').map(line).join('')}</div></article>`).join('')}</div><div class="navigator"><button data-step="-1" ${day===0?'disabled':''}>← 前一日</button><button data-step="1" ${day===5?'disabled':''}>下一日 →</button></div></section><aside class="side"><div class="stay"><small>TONIGHT / 今晚住邊</small><h3>${esc(d.stay.split('\n')[0])}</h3><p>${esc(d.stay.split('\n').slice(1).join(' · '))}</p></div><div class="note"><b>車程點樣睇？</b>綠色底係車程／交通提示。＊係粗略預留，未逐段導航實測；不包泊車、步行及排隊。一般每站另外留10–15分鐘。酒店同未定餐廳落實後需重核。</div><div class="note"><b>今日地址・營業參考</b>${d.places.map(id=>DATA.places.find(p=>p.id===id)).filter(Boolean).map(mini).join('')}<p class="pending">「必去／必食」係行程優先，唔代表已預約。標示待核實嘅店尚未落實。</p></div></aside></div><div class="legend">○ 可以標記完成；只儲存喺目前瀏覽器，唔會修改原試算表。</div>`;}else if(view==='overview'){app.innerHTML=`<div class="overview">${DATA.days.map((d,i)=>`<button class="ov" data-day="${i}"><div class="eyebrow">DAY 0${i+1} · ${d.date}（${d.weekday}）</div><h3>${esc(d.title)}</h3><p class="route">${esc(d.route)}</p>${d.slots.slice(0,4).map(x=>`<p><small>${x.label} ／ </small>${esc(x.text.split('\n').find(t=>!t.includes('→'))||x.text.split('\n')[0])}</p>`).join('')}<small>${esc(d.stay.split('\n')[0])}</small><p>查看完整當日行程 →</p></button>`).join('')}</div>`;}else if(view==='places'){app.innerHTML='<input class="search" aria-label="搜尋餐廳或景點" placeholder="搜尋：貝果、Gilgal、地址、休息日…"><div class="places" id="results"></div>';places('');document.querySelector('.search').addEventListener('input',e=>places(e.target.value));}else{app.innerHTML=`<div class="staygrid"><div class="stay"><small>STAY A / 連住 3 晚</small><h3>金寧（舊左邑）</h3><p>10/30 入住 → 11/2 退房</p><p>4房2廁・最多9人・200坪免費泊車・有BBQ。Ory 魚生同萬丈窟都喺金寧，10/30 晚餐同 11/1 第一站都喺門口。⚠️水電另計約 ₩5,000–11,000／日。</p></div><div class="stay"><small>STAY B / 連住 2 晚</small><h3>西歸浦・中文/하원동</h3><p>11/2 入住 → 11/4 退房</p><p>서귀포 법화로10번길 10-4（하원동・비밀의 하원）· 近 Waterworld、Doldam、1100 道路。</p></div></div><div class="info"><b>住宿已訂（2026-09-24）</b><br>北＝조천／함덕 Airbnb（3房3廁）10/30–11/2 共3晚 HK$3,165；南＝중문／하원동 Airbnb（3房3廁、5張真床）11/2–11/4 共2晚 HK$3,594（不設退款）。合計 HK$6,759，4人人均約 HK$1,690。兩邊都有泊車位，多數 self check-in，出發前同 host 確認。</div><div class="places"><div class="placecard"><div class="eyebrow">OUTBOUND</div><h3>10/30 · 02:10 香港起飛 → 06:10 抵達</h3><p>✅航班同租車都確認。入境＋行李40分 → 接駁15分 → <b>07:15 取車</b>（已由08:00改早）→ 約07:50上到車。</p><p>當日：08:10 우진해장국 → 09:05 龍頭岩 → 10:00 夢塔（足1鐘45分）→ 道頭鮑魚 → 조천 check-in → 송당吉卜力展 → 김녕 Ory魚生 → 19:40返base早抖。</p></div><div class="placecard"><div class="eyebrow">RETURN</div><h3>11/4 · 22:10 濟州起飛 → 11/5 00:20 到港</h3><p>✅已確認。18:00–19:00 黃金漁場晚餐 → 19:15 入油／還車 → 20:00 到機場（起飛前2小時10分）。</p><p>⚠️00:20落機，機場快綫尾班約00:48 —— 出發前安排定返屋企交通。還車預足30–40分鐘。</p></div></div><div class="info"><b>牛島 · 11/1</b><br>10:05到城山港泊車買飛、10:30開船；島上用循環巴士自由券 ₩8,000/人（20分鐘一班、無限上落）；14:45搭巴士返천진항、15:00回程船。🛂每人要帶護照填승선신고서，外國人一定查。⚠️城山港每30分鐘一班、隨時運航，但冬季首／尾班會縮，出發前查實。🚤검멀레快艇（₩20,000大人／₩15,000小童、約20分鐘）由海上睇藍洞 —— 11/1係14물小潮、滿潮15:09，行唔入個洞。</div><details class="note"><summary>查看完整行程備註</summary>${DATA.notes.map(r=>`<p><b>${esc(r[0])} · ${esc(r[1])}</b>${esc(r[2])}</p>`).join('')}</details>`;}}
function places(q){const list=DATA.places.filter(p=>Object.values(p).join(' ').toLowerCase().includes(q.toLowerCase()));document.getElementById('results').innerHTML=list.map(p=>`<article class="placecard"><small>${esc(p.kind)} · ${esc(p.when)}</small><h3>${esc(p.name)}</h3><p>${esc(p.address)}</p><p><b>時間：</b>${esc(p.hours)}</p><p>${esc(p.rest)}</p><p class="pending">${esc(p.note)}</p><p>${esc(p.phone)}</p>${map(p)}<div class="sources">${src(p.sources)}</div></article>`).join('')||'<div class="empty">搵唔到，試下其他名稱。</div>';}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-view]');if(tab){view=tab.dataset.view;render();return}const d=e.target.closest('[data-day]');if(d){day=+d.dataset.day;view='daily';render();return}const step=e.target.closest('[data-step]');if(step){day=Math.max(0,Math.min(5,day+(+step.dataset.step)));render();document.querySelector('.tabs').scrollIntoView({behavior:'smooth'});return}const c=e.target.closest('[data-check]');if(c){done[c.dataset.check]=!done[c.dataset.check];try{localStorage.setItem('jeju2026checks',JSON.stringify(done))}catch(e){}c.classList.toggle('on',done[c.dataset.check]);c.textContent=done[c.dataset.check]?'✓':'○';c.setAttribute('aria-pressed',!!done[c.dataset.check]);}});render();
