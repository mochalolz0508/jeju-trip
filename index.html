d": "景點", "when": "11/3 二 16:00–16:45（新增）", "name": "龍頭海岸｜용머리해안", "address": "서귀포시 안덕면 사계리（산방산 山腳）", "hours": "日間;潮汐／風浪決定開放", "rest": "⚠️漲潮或風浪大即封,現場問售票處", "note": "산방산腳下嘅海蝕崖棧道,約₩2,000,平路行30–40分鐘,唔使行山。山茶花落嚟10–15分,同사계日落點就喺隔籬 —— 封咗就直接去沙灘睇日落,零損失。", "phone": "—", "sources": "2026-10-13 新增;當日現場確認開放"}, {"id": "景點39", "kind": "景點", "when": "10/30 五 09:00–09:30（新增）", "name": "龍頭岩＋龍淵吊橋｜용두암 · 용연구름다리", "address": "제주시 용담이동 2581（용두암）", "hours": "戶外,24小時開放", "rest": "無固定休;大風／大浪日崖邊注意,免費", "note": "龍頭形狀嘅海邊火山岩,濟州市最經典地標之一。免費,影相15–20分鐘。隔籬步行5分鐘係 용연구름다리 龍淵吊橋。喺 서사로(우진해장국) → 노형(夢塔) 途中約10分＊,填返夢塔10:00開舖之前嘅死位。取車手續拖得耐就第一個跳。 同一條 용담–도두 海岸路再西行就係彩虹海岸路,但彩虹嗰段喺도두(11/4傍晚先去),今朝唔使兜。", "phone": "—", "sources": "2026-10-13 新增（用戶要求）"}, {"id": "景點40", "kind": "景點", "when": "11/1 日 12:30–13:30（新增）", "name": "榧子林 千年榧樹林｜비자림", "address": "제주시 구좌읍 비자숲길 55", "hours": "09:00–18:00（尾入17:00）", "rest": "全年無休;泊車免費", "note": "2,800棵500–800年樹齡嘅榧樹，樹高7–14米。全程平路步道，完全唔使爬山，行約1個鐘。成人₩3,000／青少年₩1,500。⚠️係常綠林唔係紅葉，睇紅葉留返11/4漢拏山。★2026-10-16剪走牛島之後加入，喺萬丈窟同龍眼岳中間，順路。", "phone": "—", "sources": "https://www.ktriptips.com/kor/tourspot/126472"}], "notes": [["計劃基準", "2026/10/30–11/4；6日5夜（航班＋租車全部確認）", "✅航班全部確認:去程 10/30 02:10 香港起飛 → 06:10 抵達濟州;回程 11/4 22:10 濟州起飛 → 11/5 00:20 抵達香港。✅租車已改做 07:15 取車（原本book 08:00，2026-10-15改咗）—— 慳返機場乾等嘅70分鐘，夢塔返返足1鐘45分，07:15車到手(唔係嗰陣先辦手續);手續拖到07:50都唔怕,夢塔10:00先開舖,09:40–10:00係安全墊。⚠️11/5 00:20落機:機場快綫尾班約00:48，出發前安排定返屋企交通。4人自駕，全程只搬一次屋（11/2）。", "用戶提供航班／租車資料 2026-10-15"], ["★ 2026-10-13 改版做咗乜", "順路審查 ＋ 補返瀑布 ＋ 加水上活動", "1) 10/30剪走樹木園夜市（김녕→은수길35–40分、再返조천30分，淨繞路50–55分鐘夜車，而第一日通宵機冇瞓過）→ 19:40返到base早抖。2) 10/31成個朝頭早提早25分鐘，確保13:20到騎馬場做第一批（原本12:25先食飯，一排隊就趕唔切）。3) 11/1牛島加검멀레快艇做水上活動、藍洞改由海上睇；尾段執返섭지코지（日落17:36）。4) 11/2晚천지연폭포由「攰就跳過」升做正式（零繞路）。5) 11/3加천제연폭포＋용머리해안，카멜리아힐由2個半鐘剪到1鐘45分。6) 11/4 Gomimi調做第一站（售完即收）；도두봉由16:15改17:00（原本根本見唔到17:36嘅日落）；蓮洞由20分鐘假站變一個鐘。7) 黃金漁場、夢塔掃貨、新緣橋煙花 —— 用戶指定全部保留不變。", "用戶決定 2026-10-13"], ["★ 煙花(새연교) 照去", "10/31 六 20:00・2026最後一場", "官方『2026 금토금토 새연쇼』＝4/25–10/31、逢週五六19:00–20:40、서귀포 새연교。10/31係season最後一場。你全程只有10/30(五)、10/31(六)兩個show night，兩晚都住北面조천 —— 冇得搬，只有去或唔去，用戶決定照去。代價：협재→서귀포55–65分＋等位60分＋서귀포→조천70–80分。⚠️出發前睇官方IG確認當晚冇因天氣取消。（註：새연교夜橋本身11/2晚喺올레시장隔籬就行得到，你呢2個鐘買嘅淨係「煙花」）", "https://visitjeju.net/kr/festival/view?contentsid=CNTS_300000000014207"], ["✂️ 水上活動 已取消", "隨牛島一齊剪走", "原本係牛島檢黑沙灘嘅快艇（₩20,000–30,000／人、15–30分鐘，由海上睇藍洞）。2026-10-16剪走牛島之後一齊冇咗。提返：濟州冇腳踏式水上單車／鴨仔船（全韓國嘅都喺大邱、慶州、安東、巨濟、光州等內陸水域，濟州係海島冇平靜內陸湖）；鎖小角透明獨木舟冬季09:00–15:00仲開，但喺西歸浦東面，同11/3向西嘅路線相反，已否決。即係今次冇水上活動。", "用戶決定 2026-10-16"], ["✂️ 牛島全日 已剪", "2026-10-16 決定", "剪走原因唔係「唔好玩」，係連鎖風險：軌道單車時長唔確定（35分 vs 40–50分）→ 趕唔切10:30開船 → 島上壓縮 → 趕唔切15:00尾船 → 城山日出峰玩完，而日出峰11月2日休館冇第二次機會。外加每人要帶護照填上船申報表、島上得循環巴士20分鐘一班、快艇11月開唔開未確認。另外查實咗：牛島禁車令已延長到2029年7月31日，一般遊客嘅租車根本入唔到（例外：傷健／孕婦／帶嬰幼兒／喺島上過夜／16人座包車／電動氫能車）—— 所以根本冇「揸唔揸車」呢個選擇。藍洞本身要退潮先入到，而11/1係小潮日、滿潮15:09，行入去本來就唔得。失去嘅：西濱白沙（全韓唯一紅藻白沙灘，真係牛島獨有）、黑沙灘、牛島峰景、快艇。下次嚟濟州專登喺牛島過一晚（過夜先可以揸車入島）。", "用戶決定 2026-10-16"], ["★ 補返瀑布（原本六日零瀑布）", "11/2 천지연 ＋ 11/3 천제연", "濟州三大瀑布全部喺你11/2–11/4住緊嘅西歸浦／中文，但原行程一個都冇。天地淵폭포：09:00–22:00、尾入21:20、₩2,000，平路石屎路15分鐘，夜間打燈（42年嚟首次換新燈），就喺올레시장／이중섭거리隔籬 ⇒ 11/2晚零繞路，升做正式。天帝淵폭포：₩2,500，三段瀑布＋선임교，行到第三瀑約40分鐘，離中文住宿同대포주상절리各5分鐘 ⇒ 11/3早30分鐘出門（08:45）。정방폭포（亞洲唯一直落大海）17:20閂門，塞唔落，今次放棄。", "https://www.ktriptips.com/kor/tourspot/126437"], ["★ 樹木園夜市 已剪", "原10/30晚・原清單 Must Do 4", "수목원길 야시장（제주시 은수길69、한라수목원旁）：9–5月18:00–22:00、連年無休、免費泊車、2026年3月重開。剪佢唔係因為閂門，係位置：18:05喺김녕（東北岸）食完Ory，去夜市要35–40分（向西），再返조천30分 —— 直接返屋企只係15–20分，淨繞路50–55分鐘夜車，而嗰晚由02:10航班計已經醒咗24個鐘。內容亦只係food truck市集（黑豬串／海鮮串／果汁＋小物攤＋busking），規模細過11/4要去嘅東門市場。曾考慮搬去11/4晚（은수길離機場15分、離蓮洞5–8分，完全順路），但用戶指定黃金漁場不變 ⇒ 直接剪走。", "https://www.visitjeju.net/kr/detail/view?contentsid=CNTS_200000000007330"], ["★ 夢塔掃貨 保留", "10/30 10:00–11:45（足1鐘45分）", "제주 드림타워（Grand Hyatt Jeju、노형동 노연로12、濟州最高嗰幢）入面嘅『한컬렉션 HAN COLLECTION』K-fashion mall，約450品牌＋retail＋食閣＋高層景觀。排喺度嘅原因：室內（通宵機／落雨都頂得住）、離12:00午餐안녕전복只10分鐘、EMIS 이미스濟州獨家店喺呢度（2026/8/21開，已確認）。Matin Kim同MARITHÉ唔喺度 —— 兩間都喺원도심，11/4下午一次過行。用戶指定照去。 🆕2026-10-13：航班確認06:10落地後，09:00–10:00（夢塔未開舖）嘅死位加咗 용두암 龍頭岩＋용연구름다리（免費、15–20分鐘、서사로→노형途中10分），用戶決定。取車手續拖到08:15先搞掂就跳咗佢。", "用戶決定 2026-10-13"], ["★ 黃金漁場 保留不變", "11/ lass="navigator"><button data-step="-1" ${day===0?'disabled':''}>← 前一日</button><button data-step="1" ${day===5?'disabled':''}>下一日 →</button></div></section><aside class="side"><div class="stay"><small>TONIGHT / 今晚住邊</small><h3>${esc(d.stay.split('\n')[0])}</h3><p>${esc(d.stay.split('\n').slice(1).join(' · '))}</p></div><div class="note"><b>車程點樣睇？</b>綠色底係車程／交通提示。＊係粗略預留，未逐段導航實測；不包泊車、步行及排隊。一般每站另外留10–15分鐘。酒店同未定餐廳落實後需重核。</div><div class="note"><b>今日地址・營業參考</b>${d.places.map(id=>DATA.places.find(p=>p.id===id)).filter(Boolean).map(mini).join('')}<p class="pending">「必去／必食」係行程優先，唔代表已預約。標示待核實嘅店尚未落實。</p></div></aside></div><div class="legend">○ 可以標記完成；只儲存喺目前瀏覽器，唔會修改原試算表。</div>`;}else if(view==='overview'){app.innerHTML=`<div class="overview">${DATA.days.map((d,i)=>`<button class="ov" data-day="${i}"><div class="eyebrow">DAY 0${i+1} · ${d.date}（${d.weekday}）</div><h3>${esc(d.title)}</h3><p class="route">${esc(d.route)}</p>${d.slots.slice(0,4).map(x=>`<p><small>${x.label} ／ </small>${esc(x.text.split('\n').find(t=>!t.includes('→'))||x.text.split('\n')[0])}</p>`).join('')}<small>${esc(d.stay.split('\n')[0])}</small><p>查看完整當日行程 →</p></button>`).join('')}</div>`;}else if(view==='places'){app.innerHTML='<input class="search" aria-label="搜尋餐廳或景點" placeholder="搜尋：貝果、Gilgal、地址、休息日…"><div class="places" id="results"></div>';places('');document.querySelector('.search').addEventListener('input',e=>places(e.target.value));}else{app.innerHTML=`<div class="staygrid"><div class="stay"><small>STAY A / 連住 3 晚</small><h3>조천・咸德海灘一帶</h3><p>10/30 入住 → 11/2 退房</p><p>제주 조천읍 조천2길 30（오드랑麵包隔籬）· 近城山牛島、東福貝果/Gilgal。</p></div><div class="stay"><small>STAY B / 連住 2 晚</small><h3>西歸浦・中文/하원동</h3><p>11/2 入住 → 11/4 退房</p><p>서귀포 법화로10번길 10-4（하원동・비밀의 하원）· 近 Waterworld、Doldam、1100 道路。</p></div></div><div class="info"><b>住宿已訂（2026-09-24）</b><br>北＝조천／함덕 Airbnb（3房3廁）10/30–11/2 共3晚 HK$3,165；南＝중문／하원동 Airbnb（3房3廁、5張真床）11/2–11/4 共2晚 HK$3,594（不設退款）。合計 HK$6,759，4人人均約 HK$1,690。兩邊都有泊車位，多數 self check-in，出發前同 host 確認。</div><div document.addEventListener('click',e=>{const tab=e.target.closest('[data-view]');if(tab){view=tab.dataset.view;render();return}const d=e.target.closest('[data-day]');if(d){day=+d.dataset.day;view='daily';render();return}const step=e.target.closest('[data-step]');if(step){day=Math.max(0,Math.min(5,day+(+step.dataset.step)));render();document.querySelector('.tabs').scrollIntoView({behavior:'smooth'});return}const c=e.target.closest('[data-check]');if(c){done[c.dataset.check]=!done[c.dataset.check];try{localStorage.setItem('jeju2026checks',JSON.stringify(done))}catch(e){}c.classList.toggle('on',done[c.dataset.check]);c.textContent=done[c.dataset.check]?'✓':'○';c.setAttribute('aria-pressed',!!done[c.dataset.check]);}});render();
