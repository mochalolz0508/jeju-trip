북성로)同東門市場行得到。濟州名物고기국수＋돔베고기,啱11/4午餐再去Gomimi/東門。", "phone": "—", "sources": "https://www.diningcode.com/profile.php?rid=ohG2IpuWQopQ"}, {"id": "景點29", "kind": "景點", "when": "11/1 日 09:00（首班・Naver預約）", "name": "Jeju Rail Bike 레일바이크｜제주 레일바이크", "address": "제주시 구좌읍 용눈이오름로 641", "hours": "09:00–17:30 연중무휴", "rest": "Naver 預約 21% off;預約後1鐘起用", "note": "용눈이오름一帶草原景,踩軌道單車一圈約40–50分。喺 조천→城山 路上(順路)。要 Naver 預約揀09:00場,玩完去城山港搭船。", "phone": "—", "sources": "https://www.instagram.com/jeju_railbike_/"}, {"id": "景點30", "kind": "景點", "when": "도두점（備選,已改用애월점）", "name": "Miffy・귤귤스토어 도두점（濟州限定）", "address": "제주시 서해안로 238", "hours": "09:00–19:00 每日", "rest": "限定款售完即止", "note": "機場旁,第一日順路。濟州限定海女미피/감귤미피 公仔・키링・피규어(同 애월점一樣貨)。", "phone": "064-712-0199", "sources": "https://triple.guide/attractions/2a314211-11d8-4748-a2ee-3837e62eb001"}, {"id": "景點31", "kind": "景點", "when": "10/30 選項（訓唔到先去）", "name": "萬丈窟 Manjanggul｜만장굴", "address": "제주시 구좌읍 만장굴길 182", "hours": "09:00–18:00（末入 17:10）", "rest": "每月第1個週三休；成人約₩4,000", "note": "世界自然遺產熔岩洞窟,平路步道來回~1km(~1個鐘),長年~15°C涼爽。入口有樓梯、地面濕滑,慢行。喺東部,同 함덕/김녕(Ory)順路。", "phone": "064-710-7903", "sources": "https://www.visitjeju.net/kr/detail/view?contentsid=CONT_000000000500346"}, {"id": "景點32", "kind": "景點", "when": "10/31 六 16:40 日落", "name": "挾才海灘 Hyeopjae｜협재해수욕장", "address": "제주시 한림읍 협재리 2497-1", "hours": "戶外,全日", "rest": "—", "note": "西部翠綠海灘,望비양도,日落超靚。就喺 Flowave(한림)隔籬 5–10分鐘,10/31 西線順路。", "phone": "—", "sources": "https://www.visitjeju.net/kr/detail/view?contentsid=CONT_000000000500348"}, {"id": "餐廳23", "kind": "餐廳", "when": "11/4 三 12:00 午餐（옥돔구이）", "name": "玉鯛(옥돔)정식 큰일집｜큰일집", "address": "제주시 동광로 79 1층", "hours": "09:30–21:30 每日", "rest": "—", "note": "濟州高級玉鯛(옥돔)一夜乾鹽燒,정식₩10,000 抵食。喺 노형/연동(近蓮洞/機場),尾晚食玉鯛,唔重複海鮮。", "phone": "064-748-8788", "sources": "https://www.diningcode.com/list.dc?query=제주시%20옥돔구이"}, {"id": "餐廳24", "kind": "餐廳", "when": "備選（海膽已改去牛島食）", "name": "海膽/전복죽 곰막식당｜곰막식당", "address": "제주시 조천읍（Naver 搜 곰막식당）", "hours": "約09:00開;人氣店或要排", "rest": "—", "note": "조천 base 隔籬。회국수名店,성게국수(海膽)＋전복죽都出名。想食海膽就呢間,早少少到避排隊。", "phone": "—", "sources": "https://www.diningcode.com/list.dc?query=조천%20곰막식당"}, {"id": "景點33", "kind": "景點", "when": "10/30 五 10:00 商場", "name": "Dream Tower 大商場（그랜드하얏트）｜제주 드림타워", "address": "제주시 노연로 12", "hours": "商場/食閣 各店約10:00–22:00", "rest": "—", "note": "濟州市最大複合resort:커넥트 retail 商場＋食閣＋高層景觀,室內好行,啱抵埗日/落雨。近機場노형。", "phone": "—", "sources": "https://www.visitjeju.net/kr/detail/view?contentsid=CONT_000000000501234"}, {"id": "景點34", "kind": "景點", "when": "✂️已剪（純影相牧場;動物體驗11/2 Gilgal已有）", "name": "St. Isidore Ranch 성이시돌목장（테쉬폰/牛奶café）｜성이시돌목장", "address": "제주시 한림읍 산록남로 53", "hours": "戶外全日;우유카페約10:00–18:00", "rest": "—", "note": "테쉬폰拱形建築＋牧場＋우유카페(牛奶雪糕),影相超靚。녹고메→협재 路上(西部),輕鬆stop。", "phone": "—", "sources": "https://www.visitjeju.net/kr/detail/view?contentsid=CONT_000000000500390"}, {"id": "景點35", "kind": "景點", "when": "11/1 日 17:00–17:40（新增・日落）", "name": "涉地岬｜섭지코지", "address": "서귀포시 성산읍 고성리 일대（섭지코지）", "hours": "戶外,全日開放;建議日間至日落", "rest": "大風日崖邊注意;泊車另收費", "note": "日出峰約15分＊。平路海岬步道,望城山日出峰全景＋燈塔。11/1日落17:36,啱啱golden hour。★由牛島剪走嘅時間執返嚟(2026-10-13);之前因為11/1太逼而放棄過。唔想行就喺入口／車上望一望都影到。", "phone": "—", "sources": "2026-10-13 新增;出發前用 Naver 地圖確認泊車位置"}, {"id": "景點36", "kind": "景點", "when": "11/1 日 12:30–13:20（水上活動）", "name": "검멀레 보트투어 快艇｜우도 검멀레해변", "address": "제주시 우도면 검멀레해변", "hours": "日間;⚠️11月運營未確認", "rest": "天氣／風浪停航;우도水上項目多數4–10月做", "note": "₩20,000大人／₩15,000小童,約20分鐘。由검멀레出海沿후해석벽黑崖,順埋由海上睇동안경굴藍洞。★今次嘅水上活動就係佢 —— 濟州冇腳踏式水上單車／오리배(全韓國嘅오리배喺大邱壽城池、慶州普門、安東、巨濟、光州,濟州唔喺名單:海島冇平靜內陸湖)。⚠️11月開唔開要現場問,或叫住宿host打電話。", "phone": "—", "sources": "https://kr.trip.com/moments/detail/jeju-island-297-10720650/"}, {"id": "景點37", "kind": "景點", "when": "11/3 二 08:50–09:50（新增）", "name": "天帝淵瀑布｜천제연폭포", "address": "서귀포시 천제연로 132", "hours": "約09:00–18:00（現場確認）", "rest": "風雨或休", "note": "三段瀑布＋선임교 七仙女橋,成人₩2,500,由入口行到第三瀑約40分鐘。離中文住宿同대포주상절리各約5分鐘,零繞路。★原行程六日零瀑布,呢個同천지연係補返嘅兩個(2026-10-13)。", "phone": "—", "sources": "https://www.ktriptips.com/kor/tourspot/126439"}, {"id": "景點38", "kind": "景點", "when": "11/3 二 16:00–16:45（新增）", "name": "龍頭海岸｜용머리해안", "address": "서귀포시 안덕면 사계리（산방산 山腳）", "hours": "日間;潮汐／風浪決定開放", "rest": "⚠️漲潮或風浪大即封,現場問售票處", "note": "산방산腳下嘅海蝕崖棧道,約₩2,000,平路行30–40分鐘,唔使行山。山茶花落嚟10–15分,同사계日落點就喺隔籬 —— 封咗就直接去沙灘睇日落,零損失。", "phone": "—", "sources": "2026-10-13 新增;當日現場確認開放"}, {"id": "景點39", "kind": "景點", "when": "10/30 五 09:00–09:30（新增）", "name": "龍頭岩＋龍淵吊橋｜용두암 · 용연구름다리", "address": "제주시 용담이동 2581（용두암）", "hours": "戶外,24小時開放", "rest": "無固定休;大風／大浪日崖邊注意,免費", "note": "龍頭形狀嘅海邊火山岩,濟州市最經典地標之一。免費,影相15–20分鐘。隔籬步行5分鐘係 용연구름다리 龍淵吊橋。喺 서사로(우진해장국) → 노형(夢塔) 途中約10分＊,填返夢塔10:00開舖之前嘅死位。取車手續拖得耐就第一個跳。", "phone": "—", "sources": "2026-10-13 新增（用戶要求）"}], "notes": [["計劃基準", "2026/10/30–11/4；6日5夜", "✅去程已確認（2026-10-13）：10/30 02:10 香港起飛 → 06:10 抵達濟州 —— 比舊表假設嘅「06:30–07:00」早20–50分鐘，所以 10/30 早餐08:00同夢塔10:00都企得穩，09:00–10:00留空做入境／租車buffer。回程 22:10 仍係原訂單數字，未再核實。4人自駕，全程只搬一次屋（11/2）。", "用戶提供航班資料 2026-10-13"], ["★ 2026-10-13 改版做咗乜", "順路審查 ＋ 補返瀑布 ＋ 加水上活動", "1) 10/30剪走樹木園夜市（김녕→은수길35–40分、再返조천30分，淨繞路50–55分鐘夜車，而第一日通宵機冇瞓過）→ 19:40返到base早抖。2) 10/31成個朝頭早提早25分鐘，確保13:20到騎馬場做第一批（原本12:25先食飯，一排隊就趕唔切）。3) 11/1牛島加검멀레快艇做水上活動、藍洞改由海上睇；尾段執返섭지코지（日落17:36）。4) 11/2晚천지연폭포由「攰就跳過」升做正式（零繞路）。5) 11/3加천제연폭포＋용머리해안，카멜리아힐由2個半鐘剪到1鐘45分。6) 11/4 Gomimi調做第一站（售完即收）；도두봉由16:15改17:00（原本根本見唔到17:36嘅日落）；蓮洞由20分鐘假站變一個鐘。7) 黃金漁場、夢塔掃貨、新緣橋煙花 —— 用戶指定全部保留不變。", "用戶決定 2026-10-13"], ["★ 煙花(새연교) 照去", "10/31 六 20:00・2026最後一場", "官方『2026 금토금토 새연쇼』＝4/25–10/31、逢週五六19:00–20:40、서귀포 새연교。10/31係season最後一場。你全程只有10/30(五)、10/31(六)兩個show night，兩晚都住北面조천 —— 冇得搬，只有去或唔去，用戶決定照去。代價：협재→서귀포55–65分＋等位60分＋서귀포→조천70–80分。⚠️出發前睇官方IG確認當晚冇因天氣取消。（註：새연교夜橋本身11/2晚喺올레시장隔籬就行得到，你呢2個鐘買嘅淨係「煙花」）", "https://visitjeju.net/kr/festival/view?contentsid=CNTS_300000000014207"], ["★ 水上活動 ＝ 검멀레快艇", "11/1 牛島・₩20,000大人／₩15,000小童", "用戶想玩水上嘢。查證：濟州冇腳踏式水上單車／오리배 —— 全韓國嘅오리배喺大邱壽城池、慶州普門、安東、巨濟、光州，濟州唔喺名單（海島，冇平靜內陸湖）。협재／함덕／하고수동嘅水上項目多數4–10月做，11月初收檔。쇠소깍透明獨木舟冬季09:00–15:00仲開（₩20,000/2人、20–30分、☎064-762-1619），但喺서귀포東面，同11/3向西嘅loop相反，來回成個鐘，要砍走대포주상절리＋천제연＋용머리 ⇒ 唔抵，否決。最後揀검멀레快艇：約20分鐘，沿후해석벽黑崖，順埋由海上睇藍洞，零繞路。⚠️11月開唔開要現場問，或叫住宿host打電話。", "https://kr.trip.com/moments/detail/jeju-island-297-10720650/"], ["★ 藍洞(동안경굴) 改由海上睇", "11/1 潮汐唔夾，唔值得為佢早起", "동안경굴要退潮先行得入。2026/11/1 성산포：農曆九月廿二、14물（貼住小潮，全月潮差最細），乾潮07:55(60cm)／滿潮15:09(209cm)／乾潮22:05。你10:45上島、15:00落船，全程漲緊水，12:30更加接近滿潮。考慮過06:15起身搭首班船捉08:00窗口，但小潮日都未必退得夠，而個洞實際得10–15分鐘嘢（1997年起每年喺入面搞洞窟音樂會，有返咁上下大，但唔係만장굴規模;最靚係企喺洞入面向出望，黑色洞口框住藍海藍天）⇒ 用「一定蝕底嘅早起」賭「15分鐘嘅洞」唔划算，改坐快艇由海上睇，漲潮反而更適合開船。⚠️出發前用『바다타임』app再查實（中途搜過一次錯數，係仁川嘅）。", "https://www.badatime.com/71-2026-11-01.html"], ["★ 補返瀑布（原本六日零瀑布）", "11/2 천지연 ＋ 11/3 천제연", "濟州三大瀑布全部喺你11/2–11/4住緊嘅西歸浦／中文，但原行程一個都冇。天地淵폭포：09:00–22:00、尾入21:20、₩2,000，平路石屎路15分鐘，夜間打燈（42年嚟首次換新燈），就喺올레시장／이중섭거리隔籬 ⇒ 11/2晚零繞路，升做正式。天帝淵폭포：₩2,500，三段瀑布＋선임교，行到第三瀑約40分鐘，離中文住宿同대포주상절리各5分鐘 ⇒ 11/3早30分鐘出門（08:45）。정방폭포（亞洲唯一直落大海）17:20閂門，塞唔落，今次放棄。", "https://www.ktriptips.com/kor/tourspot/126437"], ["★ 樹木園夜市 已剪", "原10/30晚・原清單 Must Do 4", "수목원길 야시장（제주시 은수길69、한라수목원旁）：9–5月18:00–22:00、連年無休、免費泊車、2026年3月重開。剪佢唔係因為閂門，係位置：18:05喺김녕（東北岸）食完Ory，去夜市要35–40分（向西），再返조천30分 —— 直接返屋企只係15–20分，淨繞路50–55分鐘夜車，而嗰晚由02:10航班計已經醒咗24個鐘。內容亦只係food truck市集（黑豬串／海鮮串／果汁＋小物攤＋busking），規模細過11/4要去嘅東門市場。曾考慮搬去11/4晚（은수길離機場15分、離蓮洞5–8分，完全順路），但用戶指定黃金漁場不變 ⇒ 直接剪走。", "https://www.visitjeju.net/kr/detail/view?contentsid=CNTS_200000000007330"], ["★ 夢塔掃貨 保留", "10/30 10:00–11:45（前面加咗龍頭岩）", "제주 드림타워（Grand Hyatt Jeju、노형동 노연로12、濟州最高嗰幢）入面嘅『한컬렉션 HAN COLLECTION』K-fashion mall，約450品牌＋retail＋食閣＋高層景觀。排喺度嘅原因：室內（通宵機／落雨都頂得住）、離12:00午餐안녕전복只10分鐘、EMIS 이미스濟州獨家店喺呢度（2026/8/21開，已確認）。Matin Kim同MARITHÉ唔喺度 —— 兩間都喺원도심，11/4下午一次過行。用戶指定照去。 🆕2026-10-13：航班確認06:10落地後，09:00–10:00（夢塔未開舖）嘅死位加咗 용두암 龍頭岩＋용연구름다리（免費、15–20分鐘、서사로→노형途中10分），用戶決定。取車手續拖到08:15先搞掂就跳咗佢。", "用戶決定 2026-10-13"], ["★ 黃金漁場 保留不變", "11/4 18:00 晚餐", "제주시 사장길14、09:00–21:00、LO20:00、全年。機場旁，還車前最後一餐，회／海鮮。用戶指定唔好改。時間由17:30推到18:00，因為前面도두봉要等17:36日落。", "用戶決定 2026-10-13"], ["★ 11/1 牛島 新流程", "10:30出船・15:00回程・唔使早起", "10:45落천진항 → 買循環巴士自由券₩8,000/人（20分一班，無限上落）→ 11:15–12:10 우도봉＋燈臺公園 → 12:30–13:20 검멀레（快艇＋黑沙灘）→ 13:45–14:40 서빈백사＋섬마을海膽飯＋花生雪糕 → 14:45巴士 → 15:00回程船。검멀레由35分加到50分裝隻艇。🛂上船要填승선신고서，每人要帶護照（外國人一定查，唔記得帶就上唔到船，成日報銷）。⚠️出發前查實冬季尾／首班船時間（성산항每30分鐘一班、隨時運航，但冬季會縮）。⚠️레일바이크一圈有「35分」同「40–50分」兩個講法，當50分計就得20分鐘泊車買飛上船，而11/1係星期日港口會逼 ⇒ 當「搭唔到10:30就搭下一班」。하고수동已剪。", "https://honeytip.doublej0124.com/2026/08/2026-jeju-udo-ferry-timetable.html"], ["★ 섭지코지 執返", "11/1 17:00–17:40 日落", "之前因為11/1太逼（牛島3個鐘＋日出峰登頂）而放棄。而家日出峰15:45入場（售票截17:00）、登頂來回50–60分、16:45落返嚟，啱啱接得上섭지코지（約15分＊），日落17:36 ⇒ golden hour。17:45走去오조해녀의집（約15分），佢19:00閂門，一個鐘夠食。", "助理建議 2026-10-13"], ["原 Must Do 1：賞楓", "11/4 10:45 天王寺＋1100高地濕地", "南部退房後行1100道路北上（1100도로橫穿漢拏山國立公園），順路先停1100高地濕地（拉姆薩濕地，木棧道15分鐘，平路免費），再去天王寺（漢拏山北坡，短途平路）。冇行登頂路線（성판악／관음사要8–10鐘兼要預約）—— 呢個係「唔使行山版」漢拏山賞楓。2026預測絕頂11月6日 ⇒ 11/4差兩日，係全程最紅。山路天氣差就直接返市區，唔為景點繞山。", "原表；2026紅葉預測"], ["原 Must Do 2：HARIBO", "11/2 14:15–16:15", "제주시 아연로444-1、10:00–19:00、最後入場18:00、연중무휴。搬屋日：貝果→Gilgal→市區刀削麵→HARIBO→經5·16落西歸浦（沿途山路紅葉）。排隊拖延就順延南部入住。", "https://www.visitjeju.net/en/detail/view?contentsid=CNTS_300000000013151"], ["原 Must Do 3：城山日出峰", "11/1 15:45（11/2休館，鎖死）", "11月06:00–18:00、售票截17:00；每月首個週一休＝11/2，所以日出峰只可以擺11/1，勿改。15:45入場趕得切，登頂來回50–60分。主角係個火山口（600米闊、99座岩峰圍住），要日光先睇得清，睇日出反而背光。", "https://www.visitjeju.net/en/detail/view?contentsid=CONT_000000000500349"], ["原 Must Do 4：樹木園夜市", "✂️已剪", "見上面「樹木園夜市 已剪」一條。2026-10-13因繞路剪走，唔係因為閂門。", "用戶決定 2026-10-13"], ["原 Must Do 5：Gilgal Farm", "11/2 10:45–12:15・必去", "조천읍 남조로1785-12、₩10,000、10:30–17:00（截16:30）。住宿A退房後先去東福倫敦貝果（~15分）、再Gilgal（~15–20分）—— 兩個都喺住宿隔籬，一啲都唔兜。入場送紅蘿蔔可以餵羊駝／黑豬／山羊／兔仔／小馬／鴨。", "https://mom-mom.net/en/travel/places/6715ad60c723b7a12f3c90e0"], ["原 Must Do 6：山茶花之丘", "11/3 14:00–15:45（剪咗45分鐘）", "11月08:30–18:00、末班17:00。原本俾2個半鐘 —— 一個花園唔使咁耐，剪到1鐘45分，慳返嘅時間換咗천제연폭포同용머리해안。", "用戶決定 2026-10-13"], ["原 Must Do 7：Waterworld", "11/3 10:50–12:10", "서귀포시 월드컵로33 제주월드컵경기장、10:00–20:00、最後入場19:00、全年。水主題媒體藝術，唔係一般泳池。因為前面加咗천제연＋대포주상절리，開始由10:00推到10:50。", "https://english.visitkorea.or.kr/svc/whereToGo/locIntrdn/rgnContentsView.do?vcontsId=221767"], ["原 Must Do 8：981 Park", "10/31 10:00–11:15", "제주시 애월읍 천덕로880-24。由조천base出發要55–65分 ⇒ 08:55就要走。玩到11:15 → Miffy 11:40 → 임순이네 12:10 → 녹고메 13:20，確保做騎馬第一批。", "http
