；11/2入住西歸浦市中心，連住11/2、11/3，11/4退房。全程只搬一次，不返回舊區再住。11/4回北面是去Gomimi、購物及機場。酒店或整間house均按這兩段日期找，有車位優先。"], ["原 Must Do 1：賞楓", "11/4 約10:30 天王寺", "南部退房後北上途中賞秋；西歸浦起預留60–90分鐘粗估，山路天氣不佳直接返市區，不為景點繞山。紅葉、道路情況待當季確認。", "原表；2026紅葉待查"], ["原 Must Do 2：HARIBO", "11/2 14:30 HARIBO", "轉住宿日：貝果、Gilgal、刀削麵後參觀，再向西歸浦入住。若排隊拖延，可延後南部入住和附近晚餐；不自行刪必去項，住宿接待時間須訂房時核實。", "https://www.visitjeju.net/en/detail/view?contentsid=CNTS_300000000013151&menuId=DOM_700000000010774"], ["原 Must Do 3：城山日出峰", "11/1 牛島回程後，約14:45", "11月售票至17:00；每月首個週一休，勿改11/2。目標14:00乘船離開牛島，登頂時間視靠岸、取車及交通調整；17:00在城山食海鮮鍋後才返市區。船班／天氣出發前核實。", "https://www.visitjeju.net/en/detail/view?contentsid=CONT_000000000500349"], ["原 Must Do 4：樹木園夜市", "10/31 18:30 樹木園夜市", "西部／涯月日後返回市區參觀；公開冬18–22、夏18–23，全年。天氣／攤檔可變，黃金漁場作後備。", "https://english.visitkorea.or.kr/svc/whereToGo/locIntrdn/rgnContentsView.do?vcontsId=113110"], ["原 Must Do 5：Gilgal Farm", "11/2 10:45–12:15 Gilgal・必去", "住宿A退房後先貝果，再農場；農場往市區午餐，下午HARIBO後才南下住宿B。採橘子未核實，不等同農場有採摘。", "https://mom-mom.net/en/travel/places/6715ad60c723b7a12f3c90e0"], ["原 Must Do 6：山茶花之丘", "11/3 14:00 山茶花之丘", "已移到11月，按公開冬季08:30–18:00、末班17:00規劃；14:00到有餘裕，花況未確認。", "原表"], ["原 Must Do 7：Waterworld", "11/3 10:00–11:30 Waterworld", "已核實為世界盃球場水主題媒體藝術體驗；10–20、最後入場19、全年。", "https://english.visitkorea.or.kr/svc/whereToGo/locIntrdn/rgnContentsView.do?vcontsId=221767"], ["原 Must Do 8：981 Park", "10/31 10:00 981 Park", "避開通宵機首日；票種、駕駛條件及營運安排再確認。", "https://www.981park.com/OPERATION"], ["原 Must Eat 1：88豬肉", "後備；未佔主行程餐位", "依最新主表，11/1晚餐為城山海鮮鍋，88豬肉保留後備。已核實제원길7店16:30開，閉店來源05:00／06:00不同；未獲指定日確認。", "https://english.visitkorea.or.kr/svc/whereToGo/locIntrdn/rgnContentsView.do?vcontsId=52744\nhttps://ontrip.kr/travel-guides/details/2359240"], ["原 Must Eat 2：海鮮鍋", "11/1 17:00 城山海鮮鍋・必食", "保留海鮮鍋菜式及時段。日出王湯鍋只是候選店，未核實是否符合想要的螃蟹／鮑魚／扇貝大鍋；店家及指定日期仍待確認。", "https://www.visitjeju.net/kr/detail/view?contentsid=CONT_000000000501342\nhttps://www.menupan.com/restaurant/onepage.asp?acode=H601805"], ["原 Must Eat 3：白帶魚", "11/3 12:30 春心家候選", "10:30–20，午休15:30–17；全年。已避開午休，未確認指定日公告。", "https://info.koreacharts.com/tour/2654442/contents.html"], ["原 Must Eat 4：解酒湯", "10/30 早餐：烏津／Eunhee備選", "烏津本館06–22；Eunhee高마로13길8店平日06–15、週四休，10/30週五不撞休。排隊長可換店，車程需另計。", "https://www.visitjeju.net/kr/detail/view?contentsid=CNTS_000000000018375\nhttps://info.koreacharts.com/tour/1861280/contents.html"], ["原 Must Eat 5：London Bagel", "11/2 08:45 倫敦貝果博物館・必去", "按公開每日08–18，週一08:45到店。接Gilgal、午餐、HARIBO及南部入住；排隊久則順延後段並通知住宿，款式及存貨不保證。", "https://www.koursea.com/place/1076/\nhttps://app.catchtable.co.kr/ct/shop/london_bagel_museum_jeju"], ["原 Must Eat 6：濟州橘子", "11/4 13:15 東門市場・濟州橘子", "主行程明確保留食橘子／買橘子；不是必須採摘。Gilgal農場另有時段，採摘體驗仍未核實。", "原表"], ["原 Must Eat 7：活鮑魚海鮮鍋", "10/30 18:30 活鮑魚海鮮火鍋・必食", "10/30活鮑魚海鮮火鍋保留，但改只選濟州市店，避免首日長途。符合菜式的店家／地址／營業未核實；南部三寶不能當首日市區後備。", "原表 Must Eat 2/7；指定大火鍋店尚未核實"], ["原 Must Eat 8：手工刀削麵", "11/2 13:15 手工刀削麵・必食", "原제주조개칼국수店址與營業未能唯一核實，保留菜式。翰林機場店只是後備：公開08–15、週日休；改星期一不撞固定休，但資料較舊需再核實，不保證原意手工製麵。", "https://ontrip.kr/travel-guides/details/2851461\nhttps://www.tripinfo.co.kr/info.html?content_id=2851461&content_type_id=39"], ["原 Must Eat 9：Doldam黑豬肉", "11/3 18:30 Doldam Black Pork・必食", "南部日獨立一餐。暫排中文店일주서로909，公開11–23、LO22、全年；週二按常規可行，未確認指定日。原意分店待確認，88豬肉留後備。", "https://info.koreacharts.com/tour/2876704/contents.html"], ["★ 偶來市場", "南部備選／不排首日", "保留南部備選，11/2入住後如體力許可可自行選；不回排通宵機首日，也不取代必食餐。", "https://www.visitjeju.net/en/detail/view?contentsid=CONT_000000000500731&menuId=DOM_000001920001000000"], ["★ 正房瀑布", "南部備選／不排首日", "保留南部備選，不排首日；11/3已有Waterworld及山茶花，不硬塞。", "https://english.visitkorea.or.kr/svc/whereToGo/locIntrdn/rgnContentsView.do?vcontsId=110885"], ["★ 豬肉湯麵 Gogi Guksu", "10/30 12:00 姐妹湯麵", "09–18；午休14:30–16:10／LO17:50；週三及春節中秋休。不可移到11/4週三。", "https://ontrip.kr/travel-guides/details/3497636"], ["★ 鮑魚粥 Jeonbokjuk", "後加備選／移出主行程", "鮑魚粥只是後加備選，未佔主行程；農場已改11/2。", "https://info.koreacharts.com/tour/2758939/contents.html"], ["★ 新星岳芒草", "10/31 下午替換候選", "與涯月café二揀一；有斜坡，風大或不想行山就留海邊。", "https://www.visitjeju.net/en/themtour/view?contentsid=CNTS_200000000010253&menuId=DOM_000002000000000221"], ["其他特色菜", "其他菜式僅供自選", "烤玉鯛、海螺刀削麵等只作額外參考，不自行取代原本必食項目。", "https://www.visitjeju.net/en/themtour/view?contentsid=CNTS_300000000012871&menuId=DOM_200000000011166"], ["橘園替換候選", "採摘另行確認，未排實", "橘子11/4東門市場食／買；Gilgal11/2農場體驗。採摘場次未核實，不當成已安排採摘。", "https://m.visitjeju.net/en/detail/view?contentsid=CNTS_300000000013985"], ["11/4 還車與航班", "18:30還車／19:15到機場為暫定", "22:10航班已確認；以航空公司登機要求、租車營業與接駁班次調整。還車不假設5分鐘完成。", "用戶航班；其餘待租車確認"], ["營業核對怎樣看", "2026/9/23查核；非指定日保證", "「按常規應開」只表示公開時間及固定休息日吻合，未獲店家確認10/30–11/4臨時休業。未查實、來源衝突及舊資料已列出。詳細韓文地址／電話／來源在新增分頁。"]]};let day=0,view='daily';const app=document.getElementById('app');let done={};try{done=JSON.parse(localStorage.getItem('jeju2026checks')||'{}')}catch(e){}const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const src=s=>(s.match(/https?:\/\/[^\s]+/g)||[]).map((x,i)=>`<a href="${esc(x)}" target="_blank" rel="noopener">來源 ${i+1} ↗</a>`).join('');const map=p=>p.address&&!p.address.includes('未')?`<a class="maplink" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.address+' '+p.name.split('｜').pop())}" target="_blank" rel="noopener">開啟地圖 ↗</a>`:'';function mini(p){return `<details class="place-mini"><summary>${esc(p.name.split('｜')[0])}</summary><p>${esc(p.address)}</p><p>營業參考：${esc(p.hours)}</p><p>${esc(p.rest)} ${esc(p.note)}</p>${map(p)}<div class="sources">${src(p.sources)}</div></details>`}function line(s,i){return `<div class="${(/約.*(分鐘|分＊)|車程|預留.*分鐘/.test(s)?'drive':('line'+(i===0?' first':'')))}">${esc(s)}</div>`}function render(){document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',b.dataset.view===view)});if(view==='daily'){const d=DATA.days[day];app.innerHTML=`<div class="dates" role="group" aria-label="選擇日期">${DATA.days.map((x,i)=>`<button class="date ${day===i?'active':''}" data-day="${i}" aria-pressed="${day===i}"><small>DAY 0${i+1}</small><strong>${x.date}</strong><span>週${x.weekday}</span></button>`).join('')}</div><div class="layout"><section><div class="dayhead"><div class="eyebrow">DAY 0${day+1} / ${day<3?'北面的日子':'慢慢往南'}</div><h2>${esc(d.title)}</h2><div class="route">${esc(d.route)}</div></div><div class="timeline">${d.slots.map((x,i)=>`<article class="slot"><div class="dot">0${i+1}</div><div class="card"><div class="slotlabel">${esc(x.label)}<button class="check ${done[day+'-'+i]?'on':''}" data-check="${day}-${i}" aria-label="${esc(x.label)}完成標記" aria-pressed="${!!done[day+'-'+i]}">${done[day+'-'+i]?'✓':'○'}</button></div>${x.text.split('\n').map(line).join('')}</div></article>`).join('')}</div><div class="navigator"><button data-step="-1" ${day===0?'disabled':''}>← 前一日</button><button data-step="1" ${day===5?'disabled':''}>下一日 →</button></div></section><aside class="side"><div class="stay"><small>TONIGHT / 今晚住邊</small><h3>${esc(d.stay.split('\n')[0])}</h3><p>${esc(d.stay.split('\n').slice(1).join(' · '))}</p></div><div class="note"><b>車程點樣睇？</b>綠色底係車程／交通提示。＊係粗略預留，未逐段導航實測；不包泊車、步行及排隊。一般每站另外留10–15分鐘。酒店同未定餐廳落實後需重核。</div><div class="note"><b>今日地址・營業參考</b>${d.places.map(id=>DATA.places.find(p=>p.id===id)).filter(Boolean).map(mini).join('')}<p class="pending">「必去／必食」係行程優先，唔代表已預約。標示待核實嘅店尚未落實。</p></div></aside></div><div class="legend">○ 可以標記完成；只儲存喺目前瀏覽器，唔會修改原試算表。</div>`;}else if(view==='overview'){app.innerHTML=`<div class="overview">${DATA.days.map((d,i)=>`<button class="ov" data-day="${i}"><div class="eyebrow">DAY 0${i+1} · ${d.date}（${d.weekday}）</div><h3>${esc(d.title)}</h3><p class="route">${esc(d.route)}</p>${d.slots.slice(0,4).map(x=>`<p><small>${x.label} ／ </small>${esc(x.text.split('\n').find(t=>!t.includes('→'))||x.text.split('\n')[0])}</p>`).join('')}<small>${esc(d.stay.split('\n')[0])}</small><p>查看完整當日行程 →</p></button>`).join('')}</div>`;}else if(view==='places'){app.innerHTML='<input class="search" aria-label="搜尋餐廳或景點" placeholder="搜尋：貝果、Gilgal、地址、休息日…"><div class="places" id="results"></div>';places('');document.querySelector('.search').addEventListener('input',e=>places(e.target.value));}else{app.innerHTML=`<div class="staygrid"><div class="stay"><small>STAY A / 連住 3 晚</small><h3>濟州市・蓮洞／老衡洞</h3><p>10/30 入住 → 11/2 退房</p><p>首日近機場休息，西部及牛島放前半段。</p></div><div class="stay"><small>STAY B / 連住 2 晚</small><h3>西歸浦市中心</h3><p>11/2 入住 → 11/4 退房</p><p>只搬一次住宿；11/4北上係去機場，唔再入住。</p></div></div><div class="info"><b>住宿未訂</b><br>酒店或整間 house 都可以按以上日期搵，優先有泊車位。床位、入住時間及取消條款待選住宿後確認。</div><div class="places"><div class="placecard"><div class="eyebrow">OUTBOUND</div><h3>10/30 · 02:10 香港起飛</h3><p>10/29 早餐安排保留，當晚往香港機場。</p><p>抵達濟州及取車時間未確認；首日只留市區。</p></div><div class="placecard"><div class="eyebrow">RETURN</div><h3>11/4 · 22:10 濟州起飛</h3><p>18:30 入油／還車目標，19:15 前到機場目標。</p><p>還車手續、接駁班次及航空公司要求需另核實。</p></div></div><div class="info"><b>牛島 · 11/1</b><br>目標10:00城山出發、14:00牛島回程，與提供的11月船期圖片吻合；圖片年份及當日運航未確認。09:15到港泊車買票、13:30回碼頭候船。島內交通方式待定。</div><details class="note"><summary>查看完整行程備註</summary>${DATA.notes.map(r=>`<p><b>${esc(r[0])} · ${esc(r[1])}</b>${esc(r[2])}</p>`).join('')}</details>`;}}
function places(q){const list=DATA.places.filter(p=>Object.values(p).join(' ').toLowerCase().includes(q.toLowerCase()));document.getElementById('results').innerHTML=list.map(p=>`<article class="placecard"><small>${esc(p.kind)} · ${esc(p.when)}</small><h3>${esc(p.name)}</h3><p>${esc(p.address)}</p><p><b>時間：</b>${esc(p.hours)}</p><p>${esc(p.rest)}</p><p class="pending">${esc(p.note)}</p><p>${esc(p.phone)}</p>${map(p)}<div class="sources">${src(p.sources)}</div></article>`).join('')||'<div class="empty">搵唔到，試下其他名稱。</div>';}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-view]');if(tab){view=tab.dataset.view;render();return}const d=e.target.closest('[data-day]');if(d){day=+d.dataset.day;view='daily';render();return}const step=e.target.closest('[data-step]');if(step){day=Math.max(0,Math.min(5,day+(+step.dataset.step)));render();document.querySelector('.tabs').scrollIntoView({behavior:'smooth'});return}const c=e.target.closest('[data-check]');if(c){done[c.dataset.check]=!done[c.dataset.check];try{localStorage.setItem('jeju2026checks',JSON.stringify(done))}catch(e){}c.classList.toggle('on',done[c.dataset.check]);c.textContent=done[c.dataset.check]?'✓':'○';c.setAttribute('aria-pressed',!!done[c.dataset.check]);}});render();
</script></body></html>
