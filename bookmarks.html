body{margin:0;padding:0 16px 60px;background:var(--bg);color:var(--fg);

button,a.nv{font:inherit;font-size:13px;padding:8px 13px;border-radius:9px;border:1px solid var(--line);

button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:650}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);

transition:transform .22s;z-index:50;font-weight:650}
#toast.on{transform:translateX(-50%) translateY(0)}

const K='jejubk';let done=JSON.parse(localStorage.getItem(K)||'{}');
function save(){try{localStorage.setItem(K,JSON.stringify(done))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1400)}
function copy(txt){
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>toast('已複製：'+txt)).catch(()=>fb(txt))}
 else fb(txt)}
function fb(txt){const a=document.createElement('textarea');a.value=txt;a.style.position='fixed';
a.style.opacity=0;document.body.appendChild(a);a.focus();a.select();
try{document.execCommand('copy');toast('已複製：'+txt)}catch(e){toast('複製唔到，長按揀字')}
document.body.removeChild(a)}
function prog(){const t=DAYS.reduce((a,d)=>a+d.items.length,0);const n=Object.values(done).filter(Boolean).length;
document.getElementById('prog').textContent='已加 '+n+' / '+t+'　'+(n>=t?'✅ 全部搞掂':'')}
function render(){
 document.getElementById('list').innerHTML=DAYS.map(d=>
  '<h2>'+esc(d.d)+(d.w?'（'+esc(d.w)+'）':'')+'</h2>'+d.items.map(it=>{
   const id=it.bk;
   return '<div class="row'+(done[id]?' done':'')+'" data-id="'+esc(id)+'">'+
    '<div class="chk" data-act="chk">'+(done[id]?'✓':'')+'</div><div class="mid">'+
    '<div class="bk">'+esc(it.bk)+(it.alt?' <span class="alt">備選</span>':'')+'</div>'+
    '<div class="zh">'+esc(it.zh)+'</div><div class="ad">'+esc(it.ad)+'</div>'+
    '<div class="btns">'+
     '<button class="p" data-act="ca">複製地址</button>'+
     '<button data-act="cn">複製名</button>'+
     '<a class="nv" target="_blank" rel="noopener" href="https://map.naver.com/p/search/'+encodeURIComponent(it.ad)+'">Naver ↗</a>'+
    '</div></div></div>'}).join('')).join('');
 prog()}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 const row=b.closest('.row'),id=row.dataset.id;
 const it=DAYS.flatMap(d=>d.items).find(x=>x.bk===id);
 const a=b.dataset.act;
 if(a==='ca')copy(it.ad);else if(a==='cn')copy(it.bk);
 else{done[id]=!done[id];save();render()}});
render();
</script></body></html>
